<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body{font-family:Arial;text-align:center;background:linear-gradient(#89f7fe,#66a6ff);}
.game-box{background:white;padding:20px;width:520px;margin:40px auto;border-radius:15px;}

.option{
display:block;width:80%;margin:8px auto;
background:#4CAF50;color:white;padding:10px;
border:none;border-radius:8px;cursor:pointer;
}
.selected{background:orange;}

/* LEVEL CARDS */
.level-container{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;}
.level-card{
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
padding:20px;border-radius:15px;cursor:pointer;
}
.level-card.locked{background:grey;color:white;pointer-events:none;}
.level-card.boss{background:gold;grid-column:span 2;}

/* POPUP */
.popup{
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%);
padding:20px;border-radius:10px;
display:none;color:white;
}
.correct{background:green;}
.wrong{background:red;}
</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<!-- START -->
<div id="startScreen">
<input id="playerName" placeholder="Enter name">
<br><br>
<button onclick="startGame()">Start</button>
</div>

<!-- LEVEL SCREEN -->
<div id="levelScreen" style="display:none;">
<h3>🌟 Choose Your Mission</h3>

<div class="level-container">
<div class="level-card" onclick="startLevel(1)">Level 1<br>Factors</div>
<div id="lvl2" class="level-card locked" onclick="startLevel(2)">Level 2<br>Multiples</div>
<div id="lvl3" class="level-card locked" onclick="startLevel(3)">Level 3<br>HCF</div>
<div id="lvl4" class="level-card locked" onclick="startLevel(4)">Level 4<br>LCM</div>
<div id="boss" class="level-card boss locked" onclick="startLevel(5)">👑 Boss</div>
</div>
</div>

<!-- GAME -->
<div id="gameScreen" style="display:none;">
<p id="status"></p>
<p id="question"></p>
<div id="area"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>
</div>

</div>

<div id="popup" class="popup"></div>

<script>

let level=1, unlocked=1, qIndex=0;
let answer, userAns;

/* START */
function startGame(){
    if(playerName.value.trim()===""){
        showPopup("Enter name","wrong");
        return;
    }
    startScreen.style.display="none";
    levelScreen.style.display="block";
}

/* START LEVEL */
function startLevel(l){
    if(l>unlocked){
        showPopup("Locked","wrong");
        return;
    }

    level=l;
    qIndex=0;

    levelScreen.style.display="none";
    gameScreen.style.display="block";

    loadQ();
}

/* LOAD QUESTION */
function loadQ(){
    nextBtn.style.display="none";
    area.innerHTML="";
    userAns=null;

    status.innerText=`Question ${qIndex+1} of 3`;

    // LEVEL 1 - FACTORS MCQ
    if(level===1){
        let num=12;
        question.innerText="Which is a factor of 12?";
        let opts=[2,3,5,7];
        answer=2;

        opts.forEach(o=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=o;
            btn.onclick=()=>userAns=o;
            area.appendChild(btn);
        });
    }

    // LEVEL 2 - MULTIPLES MCQ
    else if(level===2){
        question.innerText="Which is a multiple of 5?";
        let opts=[10,12,14,17];
        answer=10;

        opts.forEach(o=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=o;
            btn.onclick=()=>userAns=o;
            area.appendChild(btn);
        });
    }

    // LEVEL 3 - FILL
    else if(level===3){
        question.innerText="HCF of 12 and 18 is ___";
        let inp=document.createElement("input");
        inp.oninput=()=>userAns=inp.value;
        area.appendChild(inp);
        answer=6;
    }

    // LEVEL 4 - TRUE/FALSE
    else if(level===4){
        question.innerText="LCM of 4 and 6 is 12";

        ["True","False"].forEach(v=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=v;
            btn.onclick=()=>userAns=(v==="True");
            area.appendChild(btn);
        });

        answer=true;
    }

    // BOSS MIX
    else{
        let types=["mcq","fill","tf"];
        let t=types[Math.floor(Math.random()*3)];

        if(t==="mcq"){
            question.innerText="Factor of 15?";
            answer=3;

            [2,3,4,5].forEach(o=>{
                let btn=document.createElement("button");
                btn.className="option";
                btn.innerText=o;
                btn.onclick=()=>userAns=o;
                area.appendChild(btn);
            });
        }

        if(t==="fill"){
            question.innerText="LCM of 3 and 5 is ___";
            let inp=document.createElement("input");
            inp.oninput=()=>userAns=inp.value;
            area.appendChild(inp);
            answer=15;
        }

        if(t==="tf"){
            question.innerText="6 is a multiple of 3";

            ["True","False"].forEach(v=>{
                let btn=document.createElement("button");
                btn.className="option";
                btn.innerText=v;
                btn.onclick=()=>userAns=(v==="True");
                area.appendChild(btn);
            });

            answer=true;
        }
    }
}

/* CHECK */
function checkAnswer(){
    if(userAns==answer){
        showPopup("Correct 🎉","correct");
        nextBtn.style.display="inline";
    }else{
        showPopup("Try Again","wrong");
    }
}

/* NEXT */
function nextQuestion(){
    qIndex++;

    if(qIndex===3){
        unlocked++;

        if(unlocked>=2) lvl2.classList.remove("locked");
        if(unlocked>=3) lvl3.classList.remove("locked");
        if(unlocked>=4) lvl4.classList.remove("locked");
        if(unlocked>=5) boss.classList.remove("locked");

        gameScreen.style.display="none";
        levelScreen.style.display="block";
    }
    else loadQ();
}

/* POPUP */
function showPopup(msg,type){
    popup.className="popup "+type;
    popup.innerText=msg;
    popup.style.display="block";
    setTimeout(()=>popup.style.display="none",1000);
}

</script>

</body>
</html>
