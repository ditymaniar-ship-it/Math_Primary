<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:linear-gradient(#89f7fe,#66a6ff);
}

.game-box{
    background:white;
    padding:20px;
    width:520px;
    margin:40px auto;
    border-radius:15px;
}

/* OPTIONS */
.option{
    display:block;
    width:80%;
    margin:8px auto;
    background:#4CAF50;
    color:white;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
.option:hover{background:#45a049;}
.selected{background:orange;}

/* LEVEL CARDS */
.level-container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.level-card{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    padding:20px;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
}

.level-card:hover{transform:scale(1.05);}

/* LOCKED FIX */
.level-card.locked{
    background:grey;
    color:white;
    opacity:0.6;
    cursor:not-allowed;
}

.level-card.boss{
    background:gold;
    grid-column:span 2;
}

/* POPUP */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:20px;
    border-radius:10px;
    display:none;
    color:white;
    z-index:999;
}
.correct{background:green;}
.wrong{background:red;}
</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<!-- START -->
<div id="startScreen">
<input id="playerName" placeholder="Enter name">
<br><br>
<button onclick="startGame()">Start</button>
</div>

<!-- LEVEL SCREEN -->
<div id="levelScreen" style="display:none;">
<h3>🌟 Choose Your Mission</h3>

<div class="level-container">

<div class="level-card" onclick="startLevel(1)">
Level 1<br>Factors
</div>

<div id="lvl2" class="level-card locked" onclick="startLevel(2)">
Level 2<br>Multiples
</div>

<div id="lvl3" class="level-card locked" onclick="startLevel(3)">
Level 3<br>HCF
</div>

<div id="lvl4" class="level-card locked" onclick="startLevel(4)">
Level 4<br>LCM
</div>

<div id="boss" class="level-card boss locked" onclick="startLevel(5)">
👑 Boss Level
</div>

</div>
</div>

<!-- GAME -->
<div id="gameScreen" style="display:none;">
<p id="status"></p>
<p id="question"></p>
<div id="area"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>
</div>

</div>

<div id="popup" class="popup"></div>

<script>

let level=1, unlocked=1, qIndex=0;
let answer=null, userAns=null;

/* START */
function startGame(){
    let name=document.getElementById("playerName").value.trim();
    if(name===""){
        showPopup("Enter name","wrong");
        return;
    }

    document.getElementById("startScreen").style.display="none";
    document.getElementById("levelScreen").style.display="block";
}

/* LEVEL */
function startLevel(l){

    if(l>unlocked){
        showPopup("🔒 Level Locked","wrong");
        return;
    }

    level=l;
    qIndex=0;

    document.getElementById("levelScreen").style.display="none";
    document.getElementById("gameScreen").style.display="block";

    loadQ();
}

/* LOAD */
function loadQ(){

    userAns=null;
    document.getElementById("nextBtn").style.display="none";

    let area=document.getElementById("area");
    area.innerHTML="";

    document.getElementById("status").innerText="Question "+(qIndex+1)+" of 3";

    // LEVEL 1
    if(level===1){
        document.getElementById("question").innerText="Which is a factor of 12?";
        let opts=[2,3,5,7];
        answer=2;

        opts.forEach(o=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=o;
            btn.onclick=function(){
                userAns=o;
                highlight(btn);
            };
            area.appendChild(btn);
        });
    }

    // LEVEL 2
    else if(level===2){
        document.getElementById("question").innerText="Which is a multiple of 5?";
        let opts=[10,12,14,17];
        answer=10;

        opts.forEach(o=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=o;
            btn.onclick=function(){
                userAns=o;
                highlight(btn);
            };
            area.appendChild(btn);
        });
    }

    // LEVEL 3
    else if(level===3){
        document.getElementById("question").innerText="HCF of 12 and 18 is ___";
        let inp=document.createElement("input");
        inp.oninput=function(){userAns=inp.value;};
        area.appendChild(inp);
        answer=6;
    }

    // LEVEL 4
    else if(level===4){
        document.getElementById("question").innerText="LCM of 4 and 6 is 12";
        answer=true;

        ["True","False"].forEach(v=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=v;
            btn.onclick=function(){
                userAns=(v==="True");
                highlight(btn);
            };
            area.appendChild(btn);
        });
    }

    // BOSS
    else{
        document.getElementById("question").innerText="Factor of 15?";
        let opts=[2,3,4,5];
        answer=3;

        opts.forEach(o=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=o;
            btn.onclick=function(){
                userAns=o;
                highlight(btn);
            };
            area.appendChild(btn);
        });
    }
}

/* HIGHLIGHT */
function highlight(btn){
    document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
}

/* CHECK */
function checkAnswer(){
    if(userAns==null){
        showPopup("Select answer","wrong");
        return;
    }

    if(userAns==answer){
        showPopup("Correct 🎉","correct");
        document.getElementById("nextBtn").style.display="inline";
    }else{
        showPopup("Try Again","wrong");
    }
}

/* NEXT */
function nextQuestion(){
    qIndex++;

    if(qIndex===3){
        unlocked++;

        if(unlocked>=2) document.getElementById("lvl2").classList.remove("locked");
        if(unlocked>=3) document.getElementById("lvl3").classList.remove("locked");
        if(unlocked>=4) document.getElementById("lvl4").classList.remove("locked");
        if(unlocked>=5) document.getElementById("boss").classList.remove("locked");

        document.getElementById("gameScreen").style.display="none";
        document.getElementById("levelScreen").style.display="block";
    }
    else{
        loadQ();
    }
}

/* POPUP */
function showPopup(msg,type){
    let p=document.getElementById("popup");
    p.className="popup "+type;
    p.innerText=msg;
    p.style.display="block";

    setTimeout(()=>{p.style.display="none";},1000);
}

</script>

</body>
</html>
