<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body{font-family:Arial;text-align:center;background:#66a6ff;}
.game-box{background:white;padding:20px;width:550px;margin:40px auto;border-radius:15px;}

.option{display:block;margin:8px auto;padding:10px;width:80%;background:#4CAF50;color:white;border:none;border-radius:8px;cursor:pointer;}
.selected{background:orange;}

.popup{
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%);
padding:20px;border-radius:10px;
display:none;color:white;
}
.correct{background:green;}
.wrong{background:red;}

.match-box{display:flex;justify-content:space-around;}
.match-col div{margin:10px;padding:8px;background:#ddd;cursor:pointer;border-radius:5px;}

input{padding:10px;margin:10px;}
</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<div id="start">
<input id="name" placeholder="Enter name">
<button onclick="startGame()">Start</button>
</div>

<div id="levelScreen" style="display:none;">
<h3>Select Level</h3>
<button onclick="startLevel(1)">Level 1 MCQ</button>
<button onclick="startLevel(2)">Level 2 Match</button>
<button onclick="startLevel(3)">Level 3 Fill</button>
<button onclick="startLevel(4)">Level 4 True/False</button>
<button onclick="startLevel(5)">👑 Boss</button>
</div>

<div id="game" style="display:none;">
<p id="question"></p>
<div id="area"></div>

<button onclick="check()">Submit</button>
<button onclick="next()" id="nextBtn" style="display:none;">Next</button>
</div>

</div>

<div id="popup" class="popup"></div>

<script>

let level=1, qIndex=0;
let answer, userAns;
let matches={};

/* START */
function startGame(){
    if(name.value===""){show("Enter name","wrong");return;}
    start.style.display="none";
    levelScreen.style.display="block";
}

/* LEVEL */
function startLevel(l){
    level=l;
    qIndex=0;
    levelScreen.style.display="none";
    game.style.display="block";
    loadQ();
}

/* LOAD QUESTIONS */
function loadQ(){
    nextBtn.style.display="none";
    area.innerHTML="";
    userAns=null;
    matches={};

    // LEVEL 1 MCQ
    if(level===1){
        let num=12;
        question.innerText="Which is a factor of 12?";
        let opts=[2,3,5,7];
        answer=2;

        opts.forEach(o=>{
            let b=document.createElement("button");
            b.className="option";
            b.innerText=o;
            b.onclick=()=>userAns=o;
            area.appendChild(b);
        });
    }

    // LEVEL 2 MATCH
    else if(level===2){
        question.innerText="Match number with its multiple";

        let left=[2,3,4];
        let right=[8,6,12];

        let div=document.createElement("div");
        div.className="match-box";

        let lcol=document.createElement("div");
        let rcol=document.createElement("div");

        left.forEach(l=>{
            let d=document.createElement("div");
            d.innerText=l;
            d.onclick=()=>matches.left=l;
            lcol.appendChild(d);
        });

        right.forEach(r=>{
            let d=document.createElement("div");
            d.innerText=r;
            d.onclick=()=>matches.right=r;
            rcol.appendChild(d);
        });

        div.appendChild(lcol);
        div.appendChild(rcol);
        area.appendChild(div);

        answer={2:8,3:6,4:12};
    }

    // LEVEL 3 FILL
    else if(level===3){
        question.innerText="HCF of 12 and 18 is ___";
        let inp=document.createElement("input");
        inp.oninput=()=>userAns=inp.value;
        area.appendChild(inp);
        answer=6;
    }

    // LEVEL 4 TRUE/FALSE
    else if(level===4){
        question.innerText="LCM of 4 and 6 is 12";
        answer=true;

        ["True","False"].forEach(v=>{
            let b=document.createElement("button");
            b.className="option";
            b.innerText=v;
            b.onclick=()=>userAns=(v==="True");
            area.appendChild(b);
        });
    }

    // BOSS MIX
    else{
        let types=["mcq","fill","tf"];
        let t=types[Math.floor(Math.random()*3)];

        if(t==="mcq"){
            question.innerText="Factor of 15?";
            answer=3;
            [2,3,4,5].forEach(o=>{
                let b=document.createElement("button");
                b.className="option";
                b.innerText=o;
                b.onclick=()=>userAns=o;
                area.appendChild(b);
            });
        }

        if(t==="fill"){
            question.innerText="LCM of 3 and 5 is ___";
            let inp=document.createElement("input");
            inp.oninput=()=>userAns=inp.value;
            area.appendChild(inp);
            answer=15;
        }

        if(t==="tf"){
            question.innerText="6 is a multiple of 3";
            answer=true;
            ["True","False"].forEach(v=>{
                let b=document.createElement("button");
                b.className="option";
                b.innerText=v;
                b.onclick=()=>userAns=(v==="True");
                area.appendChild(b);
            });
        }
    }
}

/* CHECK */
function check(){

    let correct=false;

    if(level===2){
        correct=(answer[matches.left]===matches.right);
    }
    else{
        correct=(userAns==answer);
    }

    if(correct){
        show("Correct 🎉","correct");
        nextBtn.style.display="inline";
    }
    else{
        show("Try Again","wrong");
    }
}

/* NEXT */
function next(){
    qIndex++;
    if(qIndex===3){
        game.style.display="none";
        levelScreen.style.display="block";
    }
    else loadQ();
}

/* POPUP */
function show(msg,type){
    popup.className="popup "+type;
    popup.innerText=msg;
    popup.style.display="block";
    setTimeout(()=>popup.style.display="none",1000);
}

</script>

</body>
</html>
