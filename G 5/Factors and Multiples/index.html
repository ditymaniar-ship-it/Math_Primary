<!DOCTYPE html>
<html>
<head>
<title>Factors & Multiples Racing Game</title>
<style>
body{
    font-family: Arial;
    text-align:center;
    background: linear-gradient(#87CEEB, #ffffff);
}

/* TRACK */
#track{
    width:90%;
    height:120px;
    margin:20px auto;
    background:#555;
    position:relative;
    border-radius:10px;
}

/* CAR */
#car{
    width:80px;
    position:absolute;
    top:20px;
    left:0;
    transition: left 0.5s;
}

/* FINISH LINE */
#finish{
    position:absolute;
    right:10px;
    top:0;
    height:100%;
    width:5px;
    background:white;
}

/* QUESTION BOX */
#box{
    background:white;
    padding:20px;
    width:60%;
    margin:auto;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

button{
    padding:10px;
    margin:5px;
    font-size:16px;
    cursor:pointer;
}

/* PROGRESS */
#progress{
    width:80%;
    height:20px;
    background:#ddd;
    margin:20px auto;
    border-radius:10px;
}
#bar{
    height:100%;
    width:0%;
    background:green;
    border-radius:10px;
}
</style>
</head>

<body>

<h2>🚗 Factors & Multiples Racing Game</h2>

<div id="track">
    <img id="car" src="https://cdn-icons-png.flaticon.com/512/743/743922.png">
    <div id="finish"></div>
</div>

<div id="progress"><div id="bar"></div></div>

<div id="box">
    <h3 id="q">Question</h3>
    <div id="options"></div>
    <p id="msg"></p>
</div>

<script>
let position=0;
let level=1;
let wrong=0;
let correctAns=0;
let totalQ=0;

/* RANDOM NUMBER */
function rand(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

/* GENERATE QUESTION */
function loadQ(){
    wrong=0;
    document.getElementById("msg").innerHTML="";

    let qText="";
    let opts=[];
    
    /* LEVEL 1 – FACTORS */
    if(level==1){
        let num=rand(10,30);
        qText="Which is a factor of "+num+" ?";
        
        correctAns = getFactor(num);

        opts=[correctAns, rand(2,20), rand(2,20), rand(2,20)];
    }

    /* LEVEL 2 – MULTIPLES */
    else if(level==2){
        let base=rand(3,12);
        qText="Which is a multiple of "+base+" ?";
        
        correctAns = base * rand(2,10);

        opts=[correctAns, rand(10,100), rand(10,100), rand(10,100)];
    }

    /* LEVEL 3 – MIXED */
    else{
        if(Math.random()>0.5){
            let num=rand(20,50);
            qText="Select a factor of "+num;
            correctAns = getFactor(num);
            opts=[correctAns, rand(2,40), rand(2,40), rand(2,40)];
        }else{
            let base=rand(4,15);
            qText="Select a multiple of "+base;
            correctAns = base * rand(2,10);
            opts=[correctAns, rand(10,100), rand(10,100), rand(10,100)];
        }
    }

    /* SHUFFLE OPTIONS */
    opts = shuffle(opts);

    /* DISPLAY */
    document.getElementById("q").innerHTML=qText;
    let html="";
    opts.forEach(o=>{
        html+=`<button onclick="check(${o})">${o}</button>`;
    });
    document.getElementById("options").innerHTML=html;
}

/* GET CORRECT FACTOR */
function getFactor(num){
    let factors=[];
    for(let i=1;i<=num;i++){
        if(num%i===0) factors.push(i);
    }
    return factors[rand(0,factors.length-1)];
}

/* SHUFFLE */
function shuffle(arr){
    return arr.sort(()=>Math.random()-0.5);
}

/* CHECK ANSWER */
function check(ans){
    totalQ++;

    if(ans===correctAns){
        position+=10;
        document.getElementById("msg").innerHTML="✅ Correct!";
        moveCar();
        nextLevel();
    }else{
        wrong++;
        document.getElementById("msg").innerHTML="❌ Try again!";
        
        if(wrong==2){
            document.getElementById("msg").innerHTML="👉 Correct answer: "+correctAns;
        }
    }
}

/* MOVE CAR */
function moveCar(){
    document.getElementById("car").style.left=position+"%";
    document.getElementById("bar").style.width=position+"%";

    if(position>=90){
        alert("🏁 You Won the Race!");
        location.reload();
    }
}

/* ADAPTIVE LEVEL */
function nextLevel(){
    if(totalQ>3) level=2;
    if(totalQ>6) level=3;

    setTimeout(loadQ,1000);
}

/* START */
loadQ();

</script>

</body>
</html>
