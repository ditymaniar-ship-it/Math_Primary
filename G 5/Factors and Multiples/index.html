<!DOCTYPE html>
<html>
<head>
<title>Math Adventure G5</title>

<style>
body{font-family:Arial;text-align:center;background:linear-gradient(#89f7fe,#66a6ff);}
.game-box{background:white;padding:20px;width:520px;margin:40px auto;border-radius:15px;}

.option{
display:block;width:80%;margin:10px auto;
background:#4CAF50;color:white;padding:12px;
border:none;border-radius:10px;cursor:pointer;
}
.selected{background:orange !important;}

.level-container{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;}
.level-card{background:linear-gradient(#ff9a9e,#fad0c4);padding:20px;border-radius:15px;cursor:pointer;}
.level-card.locked{background:grey;opacity:0.6;}
.level-card.boss{background:gold;grid-column:span 2;}

.popup{
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%);
padding:20px;border-radius:10px;
display:none;color:white;
}
.correct{background:green;}
.wrong{background:red;}

/* PROGRESS BAR */
.progress{
width:100%;background:#ddd;border-radius:10px;margin:10px 0;
}
.progress-bar{
height:20px;background:#4CAF50;border-radius:10px;width:0%;
}
</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure (G5)</h2>

<div id="startScreen">
<input id="playerName" placeholder="Enter name">
<br><br>
<button onclick="startGame()">Start</button>
</div>

<div id="levelScreen" style="display:none;">
<h3>🌟 Choose Level</h3>
<div class="level-container">
<div class="level-card" onclick="startLevel(1)">Factors</div>
<div id="lvl2" class="level-card locked" onclick="startLevel(2)">Multiples</div>
<div id="lvl3" class="level-card locked" onclick="startLevel(3)">HCF</div>
<div id="lvl4" class="level-card locked" onclick="startLevel(4)">LCM</div>
<div id="boss" class="level-card boss locked" onclick="startLevel(5)">👑 Boss</div>
</div>
</div>

<div id="gameScreen" style="display:none;">
<div class="progress"><div id="bar" class="progress-bar"></div></div>

<p id="status"></p>
<p id="question"></p>
<div id="area"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>
</div>

</div>

<div id="popup" class="popup"></div>

<script>

let level=1, unlocked=1, qIndex=0;
let answer=null, userAns=null, attempts=0;

/* START */
function startGame(){
    if(playerName.value.trim()===""){
        showPopup("Enter name","wrong"); return;
    }
    startScreen.style.display="none";
    levelScreen.style.display="block";
}

/* LEVEL */
function startLevel(l){
    if(l>unlocked){showPopup("Locked","wrong");return;}
    level=l; qIndex=0;
    levelScreen.style.display="none";
    gameScreen.style.display="block";
    loadQ();
}

/* RANDOM */
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

/* LOAD */
function loadQ(){

    attempts=0;
    userAns=null;
    nextBtn.style.display="none";
    area.innerHTML="";

    status.innerText="Question "+(qIndex+1)+" of 3";

    // PROGRESS
    bar.style.width=(qIndex*33)+"%";

    let difficulty=qIndex; // 0 easy,1 med,2 hard

    // LEVEL 1 FACTORS
    if(level===1){
        let num = difficulty===0 ? rand(10,20) :
                  difficulty===1 ? rand(20,40) :
                                   rand(40,80);

        question.innerText="Select ALL factors of "+num;

        answer=[]; userAns=[];

        for(let i=1;i<=num;i++){
            if(num%i===0) answer.push(i);
        }

        let opts=[];
        for(let i=1;i<=10;i++) opts.push(i);

        opts.forEach(o=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=o;

            btn.onclick=()=>{
                if(userAns.includes(o)){
                    userAns=userAns.filter(x=>x!==o);
                    btn.classList.remove("selected");
                }else{
                    userAns.push(o);
                    btn.classList.add("selected");
                }
            };
            area.appendChild(btn);
        });
    }

    // LEVEL 2 MULTIPLES
    else if(level===2){
        let base = difficulty===0 ? rand(2,5) :
                   difficulty===1 ? rand(5,9) :
                                    rand(9,12);

        let correct=base*rand(2,5);

        question.innerText="Which is a multiple of "+base+"?";

        let opts=[correct,correct+1,correct+2,correct+3];
        answer=correct;

        opts.sort(()=>Math.random()-0.5);

        opts.forEach(o=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=o;
            btn.onclick=()=>{userAns=o;highlight(btn);};
            area.appendChild(btn);
        });
    }

    // LEVEL 3 HCF
    else if(level===3){
        let a=rand(10,50), b=rand(10,50);

        function hcf(x,y){while(y){[x,y]=[y,x%y];}return x;}
        answer=hcf(a,b);

        question.innerText="HCF of "+a+" and "+b+" is ___";

        let inp=document.createElement("input");
        inp.oninput=()=>userAns=inp.value;
        area.appendChild(inp);
    }

    // LEVEL 4 LCM
    else if(level===4){
        let a=rand(2,12), b=rand(2,12);

        function gcd(x,y){while(y){[x,y]=[y,x%y];}return x;}
        let lcm=(a*b)/gcd(a,b);

        let shown = Math.random()>0.5 ? lcm : lcm+rand(1,5);
        answer=(shown===lcm);

        question.innerText="LCM of "+a+" and "+b+" is "+shown;

        ["True","False"].forEach(v=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=v;
            btn.onclick=()=>{userAns=(v==="True");highlight(btn);};
            area.appendChild(btn);
        });
    }

    // BOSS
    else{
        question.innerText="Select ALL multiples of 6";
        answer=[6,12,18];
        userAns=[];

        [3,6,9,12,18].forEach(o=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=o;

            btn.onclick=()=>{
                if(userAns.includes(o)){
                    userAns=userAns.filter(x=>x!==o);
                    btn.classList.remove("selected");
                }else{
                    userAns.push(o);
                    btn.classList.add("selected");
                }
            };
            area.appendChild(btn);
        });
    }
}

/* CHECK */
function checkAnswer(){

    if(userAns===null || (Array.isArray(userAns)&&userAns.length===0)){
        showPopup("Select answer","wrong"); return;
    }

    if(Array.isArray(answer)){
        let a=[...answer].sort();
        let b=[...userAns].sort();

        if(JSON.stringify(a)===JSON.stringify(b)){
            showPopup("Correct 🎉","correct");
            nextBtn.style.display="inline";
        }else{
            attempts++;
            if(attempts===2){
                showPopup("Answer: "+answer.join(","),"correct");
                nextBtn.style.display="inline";
            }else showPopup("Try Again","wrong");
        }
    }
    else{
        if(userAns==answer){
            showPopup("Correct 🎉","correct");
            nextBtn.style.display="inline";
        }else{
            attempts++;
            if(attempts===2){
                showPopup("Answer: "+answer,"correct");
                nextBtn.style.display="inline";
            }else showPopup("Try Again","wrong");
        }
    }
}

/* NEXT */
function nextQuestion(){
    qIndex++;

    if(qIndex===3){
        unlocked++;
        if(unlocked>=2) lvl2.classList.remove("locked");
        if(unlocked>=3) lvl3.classList.remove("locked");
        if(unlocked>=4) lvl4.classList.remove("locked");
        if(unlocked>=5) boss.classList.remove("locked");

        gameScreen.style.display="none";
        levelScreen.style.display="block";
    }else loadQ();
}

/* UI */
function highlight(btn){
    document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
}

function showPopup(msg,type){
    popup.className="popup "+type;
    popup.innerText=msg;
    popup.style.display="block";
    setTimeout(()=>popup.style.display="none",1200);
}

</script>

</body>
</html>
