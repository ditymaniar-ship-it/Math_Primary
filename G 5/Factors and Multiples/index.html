<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:linear-gradient(#89f7fe,#66a6ff);
}

.game-box{
    background:white;
    padding:20px;
    width:520px;
    margin:40px auto;
    border-radius:15px;
}

/* OPTIONS */
.option{
    display:block;
    width:80%;
    margin:10px auto;
    background:#4CAF50;
    color:white;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.option:hover{background:#45a049;}
.selected{background:orange !important;}

/* LEVELS */
.level-container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.level-card{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    padding:20px;
    border-radius:15px;
    cursor:pointer;
}

.level-card.locked{
    background:grey;
    opacity:0.6;
    cursor:not-allowed;
}

.level-card.boss{
    background:gold;
    grid-column:span 2;
}

/* POPUP */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:20px;
    border-radius:10px;
    display:none;
    color:white;
}
.correct{background:green;}
.wrong{background:red;}

</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<!-- START -->
<div id="startScreen">
<input id="playerName" placeholder="Enter name">
<br><br>
<button onclick="startGame()">Start</button>
</div>

<!-- LEVEL SCREEN -->
<div id="levelScreen" style="display:none;">
<h3>🌟 Choose Your Mission</h3>

<div class="level-container">
<div class="level-card" onclick="startLevel(1)">Level 1<br>Factors</div>
<div id="lvl2" class="level-card locked" onclick="startLevel(2)">Level 2<br>Multiples</div>
<div id="lvl3" class="level-card locked" onclick="startLevel(3)">Level 3<br>HCF</div>
<div id="lvl4" class="level-card locked" onclick="startLevel(4)">Level 4<br>LCM</div>
<div id="boss" class="level-card boss locked" onclick="startLevel(5)">👑 Boss</div>
</div>
</div>

<!-- GAME -->
<div id="gameScreen" style="display:none;">
<p id="status"></p>
<p id="question"></p>
<div id="area"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>
</div>

</div>

<div id="popup" class="popup"></div>

<script>

let level=1, unlocked=1, qIndex=0;
let answer=null, userAns=null;

/* START */
function startGame(){
    let name=document.getElementById("playerName").value.trim();
    if(name===""){
        showPopup("Enter name","wrong");
        return;
    }
    startScreen.style.display="none";
    levelScreen.style.display="block";
}

/* LEVEL */
function startLevel(l){
    if(l>unlocked){
        showPopup("Locked","wrong");
        return;
    }

    level=l;
    qIndex=0;

    levelScreen.style.display="none";
    gameScreen.style.display="block";

    loadQ();
}

/* LOAD QUESTION */
function loadQ(){

    userAns=null;
    nextBtn.style.display="none";
    area.innerHTML="";

    status.innerText="Question "+(qIndex+1)+" of 3";

    // LEVEL 1 (MCQ)
    if(level===1){
        question.innerText="Which is NOT a factor of 12?";
        let opts=[2,3,5,6];
        answer=5;

        opts.forEach(o=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=o;

            btn.onclick=()=>{
                userAns=o;
                highlight(btn);
            };

            area.appendChild(btn);
        });
    }

    // LEVEL 2 (MCQ)
    else if(level===2){
        question.innerText="Which is a multiple of 4?";
        let opts=[6,8,10,14];
        answer=8;

        opts.forEach(o=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=o;

            btn.onclick=()=>{
                userAns=o;
                highlight(btn);
            };

            area.appendChild(btn);
        });
    }

    // LEVEL 3 (FILL)
    else if(level===3){
        question.innerText="HCF of 12 and 18 is ___";
        let inp=document.createElement("input");
        inp.oninput=()=>userAns=inp.value;
        area.appendChild(inp);
        answer=6;
    }

    // LEVEL 4 (TRUE FALSE)
    else if(level===4){
        question.innerText="LCM of 4 and 6 is 12";
        answer=true;

        ["True","False"].forEach(v=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=v;

            btn.onclick=()=>{
                userAns=(v==="True");
                highlight(btn);
            };

            area.appendChild(btn);
        });
    }

    // 👑 BOSS (MULTI SELECT)
    else{
        question.innerText="⚠ Select ALL factors of 15";

        answer=[1,3,5];
        userAns=[];

        [1,2,3,4,5].forEach(o=>{
            let btn=document.createElement("button");
            btn.className="option";
            btn.innerText=o;

            btn.onclick=()=>{
                if(userAns.includes(o)){
                    userAns=userAns.filter(x=>x!==o);
                    btn.classList.remove("selected");
                }else{
                    userAns.push(o);
                    btn.classList.add("selected");
                }
            };

            area.appendChild(btn);
        });
    }
}

/* HIGHLIGHT */
function highlight(btn){
    document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
}

/* CHECK */
function checkAnswer(){

    if(userAns===null || (Array.isArray(userAns) && userAns.length===0)){
        showPopup("Select answer","wrong");
        return;
    }

    // MULTI SELECT CHECK
    if(Array.isArray(answer)){
        let a=[...answer].sort();
        let b=[...userAns].sort();

        if(JSON.stringify(a)===JSON.stringify(b)){
            showPopup("Boss Cleared 👑","correct");
            nextBtn.style.display="inline";
        }else{
            showPopup("Try Again","wrong");
        }
    }

    else{
        if(userAns==answer){
            showPopup("Correct 🎉","correct");
            nextBtn.style.display="inline";
        }else{
            showPopup("Try Again","wrong");
        }
    }
}

/* NEXT */
function nextQuestion(){
    qIndex++;

    if(qIndex===3){
        unlocked++;

        if(unlocked>=2) lvl2.classList.remove("locked");
        if(unlocked>=3) lvl3.classList.remove("locked");
        if(unlocked>=4) lvl4.classList.remove("locked");
        if(unlocked>=5) boss.classList.remove("locked");

        gameScreen.style.display="none";
        levelScreen.style.display="block";
    }
    else{
        loadQ();
    }
}

/* POPUP */
function showPopup(msg,type){
    popup.className="popup "+type;
    popup.innerText=msg;
    popup.style.display="block";

    setTimeout(()=>popup.style.display="none",1000);
}

</script>

</body>
</html>
