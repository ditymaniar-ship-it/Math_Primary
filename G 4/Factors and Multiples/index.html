<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:linear-gradient(#89f7fe,#66a6ff);
}

.game-box{
    background:white;
    padding:20px;
    width:500px;
    margin:40px auto;
    border-radius:15px;
}

/* INPUT */
input{padding:10px;width:70%;}

/* OPTIONS */
.option{
    display:block;
    width:80%;
    margin:8px auto;
    background:#4CAF50;
    color:white;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
.selected{background:orange;}
.locked{pointer-events:none;background:grey;}

/* LEVEL CARDS */
.level-container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.level-card{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    padding:20px;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
}

.level-card:hover{
    transform:scale(1.05);
}

.level-card.locked{
    background:grey;
    color:white;
    pointer-events:none;
}

.level-card.boss{
    background:linear-gradient(135deg,#f7971e,#ffd200);
    grid-column:span 2;
}

/* POPUP */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:20px;
    border-radius:10px;
    display:none;
    color:white;
    z-index:10;
    pointer-events:none;
}
.popup.correct{background:green;}
.popup.wrong{background:red;}

/* PROGRESS */
#progressBar{background:#ddd;height:10px;border-radius:10px;}
#progressFill{height:100%;width:0%;background:green;}

</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<!-- START -->
<div id="startScreen">
<input id="playerName" placeholder="Enter name">
<br><br>
<button onclick="startGame()">Start</button>
</div>

<!-- LEVEL SCREEN -->
<div id="levelScreen" style="display:none;">
<h3>🌟 Choose Your Mission</h3>

<div class="level-container">

<div class="level-card" onclick="startLevel(1)">
<h3>Level 1</h3><p>Factors</p><span>⭐</span>
</div>

<div id="lvl2" class="level-card locked" onclick="startLevel(2)">
<h3>Level 2</h3><p>Multiples</p><span>🔒</span>
</div>

<div id="lvl3" class="level-card locked" onclick="startLevel(3)">
<h3>Level 3</h3><p>HCF</p><span>🔒</span>
</div>

<div id="lvl4" class="level-card locked" onclick="startLevel(4)">
<h3>Level 4</h3><p>LCM</p><span>🔒</span>
</div>

<div id="boss" class="level-card boss locked" onclick="startLevel(5)">
<h3>👑 Boss</h3><p>Final Challenge</p><span>🔒</span>
</div>

</div>
</div>

<!-- GAME -->
<div id="gameScreen" style="display:none;">
<div id="progressBar"><div id="progressFill"></div></div>
<p id="status"></p>
<p id="question"></p>
<div id="options"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>
</div>

</div>

<div id="popup" class="popup"></div>

<script>

let level=1,unlocked=1,qIndex=0;
let answers=[],selected=[],attempts=0;
let usedQuestions=[];
let difficulty=1;

/* START */
function startGame(){
    let name=document.getElementById("playerName").value.trim();
    if(name===""){showPopup("Enter name","wrong");return;}

    startScreen.style.display="none";
    levelScreen.style.display="block";
}

/* LEVEL */
function startLevel(l){
    if(l>unlocked){showPopup("Locked","wrong");return;}

    level=l;
    qIndex=0;
    usedQuestions=[];
    difficulty=1;

    levelScreen.style.display="none";
    gameScreen.style.display="block";

    loadQ();
}

/* LOAD QUESTIONS */
function loadQ(){
    selected=[]; attempts=0;
    nextBtn.style.display="none";

    let text="",opts=[],ans=[],key="";

    function used(k){return usedQuestions.includes(k);}
    function save(k){usedQuestions.push(k);}

    // LEVEL 1
    if(level===1){
        let num;
        do{
            num=6+Math.floor(Math.random()*20);
            key="F"+num;
        }while(used(key));
        save(key);

        text="Select factors of "+num;

        for(let i=1;i<=num;i++){
            opts.push(i);
            if(num%i===0) ans.push(i);
        }
    }

    // LEVEL 2
    else if(level===2){
        let n;
        do{
            n=2+Math.floor(Math.random()*6);
            key="M"+n;
        }while(used(key));
        save(key);

        text="Select multiples of "+n;

        for(let i=1;i<=4;i++){
            let v=n*i;
            opts.push(v); ans.push(v);
        }

        while(opts.length<8){
            let w=Math.floor(Math.random()*40)+2;
            if(w%n!==0 && !opts.includes(w)) opts.push(w);
        }
    }

    // LEVEL 3
    else if(level===3){
        let a,b;
        do{
            a=10+Math.floor(Math.random()*20);
            b=10+Math.floor(Math.random()*20);
            key="H"+a+b;
        }while(used(key));
        save(key);

        function hcf(x,y){while(y){let t=y;y=x%y;x=t;}return x;}
        let c=hcf(a,b);

        text=`Find HCF of ${a} & ${b}`;
        ans=[c];
        opts=[c,c+1,c+2,c-1].filter(v=>v>0);
    }

    // LEVEL 4 LCM
    else if(level===4){
        let a,b;
        do{
            a=3+Math.floor(Math.random()*6);
            b=4+Math.floor(Math.random()*6);
            key="L"+a+b;
        }while(used(key));
        save(key);

        function lcm(x,y){
            let m=Math.max(x,y);
            while(true){
                if(m%x===0 && m%y===0) return m;
                m++;
            }
        }

        let c=lcm(a,b);

        text=`Find LCM of ${a} & ${b}`;
        ans=[c];
        opts=[c,c+2,c+4,c-2].filter(v=>v>0);
    }

    // BOSS
    else{
        function lcm(x,y){
            let m=Math.max(x,y);
            while(true){
                if(m%x===0 && m%y===0) return m;
                m++;
            }
        }

        let stories=[
            {id:1,q:"👑 Lights blink every 3 & 4 mins. When together?",a:lcm(3,4)},
            {id:2,q:"👑 Buses every 2 & 5 mins. When together?",a:lcm(2,5)},
            {id:3,q:"👑 Claps every 4 & 6 sec. When together?",a:lcm(4,6)}
        ];

        let s;
        do{s=stories[Math.floor(Math.random()*3)];}while(used(s.id));
        save(s.id);

        text=s.q;
        ans=[s.a];
        opts=[s.a,s.a+2,s.a+4,s.a-2].filter(v=>v>0);
    }

    answers=ans;
    question.innerText=text;

    opts.sort(()=>Math.random()-0.5);

    options.innerHTML="";
    opts.forEach(o=>{
        let btn=document.createElement("button");
        btn.className="option";
        btn.innerText=o;
        btn.onclick=()=>selectOption(btn,o);
        options.appendChild(btn);
    });

    status.innerText=`Level ${level} | Q${qIndex+1}/3`;
}

/* SELECT */
function selectOption(btn,val){
    if(btn.disabled) return;

    if(selected.includes(val)){
        selected=selected.filter(v=>v!==val);
        btn.classList.remove("selected");
    }else{
        selected.push(val);
        btn.classList.add("selected");
    }
}

/* CHECK */
function checkAnswer(){
    let correct=answers.every(a=>selected.includes(a)) &&
                selected.every(s=>answers.includes(s));

    if(correct){
        showPopup("Correct 🎉","correct");

        if(level===5){
            showPopup("🏆 CONGRATULATIONS!","correct");
            confetti();
        }

        nextBtn.style.display="inline";
    }else{
        attempts++;

        if(attempts>=2){
            showPopup("Answer shown","correct");

            document.querySelectorAll(".option").forEach(b=>{
                let v=parseInt(b.innerText);
                if(answers.includes(v)) b.style.background="green";
                else if(selected.includes(v)) b.style.background="red";
                b.disabled=true;
            });

            nextBtn.style.display="inline";
            return;
        }

        showPopup("Try Again","wrong");
    }
}

/* NEXT */
function nextQuestion(){
    qIndex++;

    if(qIndex===3){
        unlocked++;

        if(unlocked>=2){lvl2.classList.remove("locked");lvl2.querySelector("span").innerText="⭐";}
        if(unlocked>=3){lvl3.classList.remove("locked");lvl3.querySelector("span").innerText="⭐";}
        if(unlocked>=4){lvl4.classList.remove("locked");lvl4.querySelector("span").innerText="⭐";}
        if(unlocked>=5){boss.classList.remove("locked");boss.querySelector("span").innerText="🔥";}

        gameScreen.style.display="none";
        levelScreen.style.display="block";
    }
    else loadQ();
}

/* POPUP */
function showPopup(msg,type){
    let p=document.getElementById("popup");
    p.className="popup "+type;
    p.innerText=msg;
    p.style.display="block";
    setTimeout(()=>p.style.display="none",1000);
}

/* CONFETTI */
function confetti(){
    for(let i=0;i<40;i++){
        let c=document.createElement("div");
        c.style.position="fixed";
        c.style.width="6px";
        c.style.height="6px";
        c.style.background="red";
        c.style.left=Math.random()*100+"%";
        c.style.top="-10px";

        document.body.appendChild(c);

        let fall=setInterval(()=>{
            c.style.top=parseInt(c.style.top)+5+"px";
            if(parseInt(c.style.top)>window.innerHeight){
                clearInterval(fall);
                c.remove();
            }
        },30);
    }
}

</script>

</body>
</html>
