<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:linear-gradient(#89f7fe,#66a6ff);
}

.game-box{
    background:white;
    padding:20px;
    width:520px;
    margin:40px auto;
    border-radius:15px;
}

/* PROGRESS BAR FIXED */
#progressBar{
    width:100%;
    height:18px;
    background:#eee;
    border-radius:20px;
    margin-bottom:15px;
    overflow:hidden;
}

#progressFill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00c853,#64dd17);
    transition:width 0.4s ease;
}

/* OPTIONS */
.option{
    display:block;
    width:80%;
    margin:8px auto;
    background:#4CAF50;
    color:white;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
.selected{background:orange;}

/* LEVEL CARDS */
.level-container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.level-card{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    padding:20px;
    border-radius:15px;
    cursor:pointer;
}

.level-card.locked{
    background:grey;
    pointer-events:none;
    color:white;
}

.level-card.boss{
    background:gold;
    grid-column:span 2;
}

/* POPUP */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:20px;
    border-radius:10px;
    display:none;
    color:white;
}
.popup.correct{background:green;}
.popup.wrong{background:red;}
</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<!-- START -->
<div id="startScreen">
<input id="playerName" placeholder="Enter name">
<br><br>
<button onclick="startGame()">Start</button>
</div>

<!-- LEVEL -->
<div id="levelScreen" style="display:none;">
<h3>🌟 Choose Level</h3>

<div class="level-container">
<div class="level-card" onclick="startLevel(1)">Level 1<br>Factors</div>
<div id="lvl2" class="level-card locked" onclick="startLevel(2)">Level 2<br>Multiples</div>
<div id="lvl3" class="level-card locked" onclick="startLevel(3)">Level 3<br>HCF</div>
<div id="lvl4" class="level-card locked" onclick="startLevel(4)">Level 4<br>LCM</div>
<div id="boss" class="level-card boss locked" onclick="startLevel(5)">👑 Boss</div>
</div>
</div>

<!-- GAME -->
<div id="gameScreen" style="display:none;">
<div id="progressBar"><div id="progressFill"></div></div>

<p id="status"></p>
<p id="question"></p>
<div id="options"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>
</div>

</div>

<div id="popup" class="popup"></div>

<script>

let level=1, unlocked=1;
let qIndex=0;
let answers=[], selected=[], attempts=0;
let usedSet=new Set();

/* START */
function startGame(){
    if(playerName.value.trim()===""){
        showPopup("Enter name","wrong");
        return;
    }
    startScreen.style.display="none";
    levelScreen.style.display="block";
}

/* LEVEL */
function startLevel(l){
    if(l>unlocked){showPopup("Locked","wrong");return;}

    level=l;
    qIndex=0;
    usedSet.clear();

    levelScreen.style.display="none";
    gameScreen.style.display="block";

    loadQ();
}

/* LOAD */
function loadQ(){
    selected=[]; attempts=0;
    nextBtn.style.display="none";

    let text="",opts=[],ans=[],key="";

    if(level===1){
        let num;
        do{
            num=Math.floor(Math.random()*20)+6;
            key="F"+num;
        }while(usedSet.has(key));
        usedSet.add(key);

        text="Select factors of "+num;

        for(let i=1;i<=num;i++){
            opts.push(i);
            if(num%i===0) ans.push(i);
        }
    }

    else if(level===2){
        let n;
        do{
            n=Math.floor(Math.random()*6)+2;
            key="M"+n;
        }while(usedSet.has(key));
        usedSet.add(key);

        text="Select multiples of "+n;

        for(let i=1;i<=4;i++){
            let v=n*i;
            opts.push(v); ans.push(v);
        }

        while(opts.length<8){
            let w=Math.floor(Math.random()*40)+2;
            if(w%n!==0 && !opts.includes(w)) opts.push(w);
        }
    }

    else if(level===3){
        let a=Math.floor(Math.random()*20)+10;
        let b=Math.floor(Math.random()*20)+10;

        function hcf(x,y){while(y){let t=y;y=x%y;x=t;}return x;}
        let c=hcf(a,b);

        text=`Find HCF of ${a} & ${b}`;
        ans=[c];
        opts=[c,c+1,c+2,c-1].filter(v=>v>0);
    }

    else if(level===4){
        let a=Math.floor(Math.random()*6)+3;
        let b=Math.floor(Math.random()*6)+4;

        function lcm(x,y){
            let m=Math.max(x,y);
            while(true){
                if(m%x===0 && m%y===0) return m;
                m++;
            }
        }

        let c=lcm(a,b);

        text=`Find LCM of ${a} & ${b}`;
        ans=[c];
        opts=[c,c+2,c+4,c-2].filter(v=>v>0);
    }

    else{
        let stories=[
            {id:1,q:"👑 Lights blink every 3 & 4 mins. When together?",a:12},
            {id:2,q:"👑 Buses every 2 & 5 mins. When together?",a:10},
            {id:3,q:"👑 Claps every 4 & 6 sec. When together?",a:12}
        ];

        let s;
        do{s=stories[Math.floor(Math.random()*3)];}
        while(usedSet.has(s.id));
        usedSet.add(s.id);

        text=s.q;
        ans=[s.a];
        opts=[s.a,s.a+2,s.a+4,s.a-2].filter(v=>v>0);
    }

    answers=ans;

    question.innerText=text;
    status.innerText=`Question ${qIndex+1} of 3`;

    // ✅ FIXED PROGRESS (IMPORTANT)
    progressFill.style.width=((qIndex+1)/3)*100+"%";

    opts.sort(()=>Math.random()-0.5);

    options.innerHTML="";
    opts.forEach(o=>{
        let btn=document.createElement("button");
        btn.className="option";
        btn.innerText=o;

        btn.onclick=()=>{
            if(selected.includes(o)){
                selected=selected.filter(v=>v!==o);
                btn.classList.remove("selected");
            }else{
                selected.push(o);
                btn.classList.add("selected");
            }
        };

        options.appendChild(btn);
    });
}

/* CHECK */
function checkAnswer(){
    let correct=answers.every(a=>selected.includes(a)) &&
                selected.every(s=>answers.includes(s));

    if(correct){
        showPopup("Correct 🎉","correct");

        if(level===5){
            showPopup("🏆 CONGRATULATIONS!","correct");
            confetti();
        }

        nextBtn.style.display="inline";
    }else{
        attempts++;

        if(attempts>=2){
            showPopup("Answer shown","correct");
            nextBtn.style.display="inline";
            return;
        }

        showPopup("Try Again","wrong");
    }
}

/* NEXT */
function nextQuestion(){
    qIndex++;

    if(qIndex===3){
        unlocked++;

        if(unlocked>=2) lvl2.classList.remove("locked");
        if(unlocked>=3) lvl3.classList.remove("locked");
        if(unlocked>=4) lvl4.classList.remove("locked");
        if(unlocked>=5) boss.classList.remove("locked");

        gameScreen.style.display="none";
        levelScreen.style.display="block";
    }
    else loadQ();
}

/* POPUP */
function showPopup(msg,type){
    popup.className="popup "+type;
    popup.innerText=msg;
    popup.style.display="block";
    setTimeout(()=>popup.style.display="none",1000);
}

/* CLEAN CONFETTI */
function confetti(){
    for(let i=0;i<30;i++){
        let c=document.createElement("div");
        c.style.position="fixed";
        c.style.width="8px";
        c.style.height="8px";
        c.style.background=`hsl(${Math.random()*360},100%,50%)`;
        c.style.left=Math.random()*100+"%";
        c.style.top="-10px";

        document.body.appendChild(c);

        let fall=setInterval(()=>{
            c.style.top=parseInt(c.style.top)+6+"px";
            if(parseInt(c.style.top)>window.innerHeight){
                clearInterval(fall);
                c.remove();
            }
        },30);
    }
}

</script>

</body>
</html>
