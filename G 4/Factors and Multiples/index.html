<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body {
    font-family: 'Comic Sans MS', cursive;
    text-align: center;
    background: linear-gradient(-45deg, #fddb92, #a1c4fd, #fbc2eb);
    background-size: 400% 400%;
    animation: bg 8s infinite;
}

@keyframes bg {
    0% {background-position:0%}
    50% {background-position:100%}
    100% {background-position:0%}
}

.game-box {
    background: white;
    padding: 20px;
    border-radius: 20px;
    width: 420px;
    margin: auto;
    margin-top: 30px;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
}

button {
    padding: 12px;
    margin: 8px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    cursor: pointer;
}

.option {
    background: #4CAF50;
    color: white;
    width: 85%;
    display: block;
    margin: 10px auto;
}

.selected { background: orange !important; }
.correct { background: #2ecc71 !important; }
.wrong { background: #e74c3c !important; }

#nextBtn { background: #2196F3; color: white; }
.locked { background: grey; }

.popup {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    padding: 15px 25px;
    border-radius: 10px;
    font-size: 18px;
    color: white;
    opacity: 0;
    z-index: 1000;
    transition: all 0.4s ease;
}

.popup.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
}

.popup.correct { background: #2ecc71; }
.popup.wrong { background: #e74c3c; }
.popup.boss { background: purple; }

</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<div id="startScreen">
<input type="text" id="playerName" placeholder="Enter your name"><br><br>
<button onclick="startGame()">🚀 Start</button>
</div>

<div id="levelScreen" style="display:none;">
<h3>🏆 Select Level</h3>
<button onclick="startLevel(1)" id="lvl1">Level 1</button>
<button onclick="startLevel(2)" id="lvl2" class="locked">Level 2 🔒</button>
<button onclick="startLevel(3)" id="lvl3" class="locked">Level 3 🔒</button>
<button onclick="startLevel(4)" id="lvl4" class="locked">Boss Level 👑 🔒</button>
</div>

<div id="gameScreen" style="display:none;">
<p id="info"></p>
<p id="question"></p>

<div id="options"></div>

<button onclick="checkAnswer()">✅ Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">➡ Next</button>

<p id="score"></p>
</div>

</div>

<div id="popup" class="popup"></div>

<!-- SOUND -->
<audio id="correctSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="wrongSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>
<audio id="levelSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<script>
let name="", level=1, qIndex=0, score=0, lives=3;
let currentAnswers=[], selected=[];
let unlockedLevel=1;

function startGame(){
    name=document.getElementById("playerName").value;
    if(name===""){showPopup("Enter your name!", "wrong"); return;}

    document.getElementById("startScreen").style.display="none";
    document.getElementById("levelScreen").style.display="block";
}

function startLevel(lvl){
    if(lvl>unlockedLevel) return;

    level=lvl;
    qIndex=0;
    score=0;
    lives=3;

    document.getElementById("levelScreen").style.display="none";
    document.getElementById("gameScreen").style.display="block";

    if(level===4){
        showPopup("⚠ FINAL BOSS LEVEL!", "boss");
    }

    loadQuestion();
}

function loadQuestion(){
    selected=[];
    document.getElementById("nextBtn").style.display="none";

    document.getElementById("info").innerText =
        "👤 "+name+" | ❤️ "+lives+" | Level "+level+" | Q "+(qIndex+1)+"/3 | ⭐ "+score;

    let q=generateQuestion();
    document.getElementById("question").innerText=q.text;

    if(level===4){
        document.getElementById("question").style.color="red";
    } else {
        document.getElementById("question").style.color="black";
    }

    let html="";
    q.options.forEach(opt=>{
        html+=`<button class="option" onclick="selectOption(this, ${opt})">${opt}</button>`;
    });

    document.getElementById("options").innerHTML=html;
    currentAnswers=q.answers;
}

function selectOption(btn,val){
    if(selected.includes(val)){
        selected=selected.filter(v=>v!==val);
        btn.classList.remove("selected");
    } else {
        selected.push(val);
        btn.classList.add("selected");
    }
}

function checkAnswer(){
    let allCorrect=currentAnswers.every(a=>selected.includes(a));
    let noExtra=selected.every(s=>currentAnswers.includes(s));

    let buttons=document.querySelectorAll(".option");

    buttons.forEach(btn=>{
        let val=parseInt(btn.innerText);
        if(currentAnswers.includes(val)){
            btn.classList.add("correct");
        } else if(selected.includes(val)){
            btn.classList.add("wrong");
        }
    });

    if(allCorrect && noExtra){
        document.getElementById("correctSound").play();
        score+=10;
        showPopup("🎉 Correct!", "correct");
        document.getElementById("nextBtn").style.display="inline";
    } else {
        document.getElementById("wrongSound").play();
        lives--;
        showPopup("❌ Try Again!", "wrong");
        if(lives===0) endGame();
    }
}

function nextQuestion(){
    qIndex++;

    if(qIndex===3){
        unlockNextLevel();
        return;
    }

    loadQuestion();
}

function unlockNextLevel(){
    document.getElementById("levelSound").play();

    if(level===1){
        unlockedLevel=2;
        document.getElementById("lvl2").classList.remove("locked");
    }
    if(level===2){
        unlockedLevel=3;
        document.getElementById("lvl3").classList.remove("locked");
    }
    if(level===3){
        unlockedLevel=4;
        document.getElementById("lvl4").classList.remove("locked");
    }

    showPopup("🎉 Level Complete!", "correct");

    document.getElementById("gameScreen").style.display="none";
    document.getElementById("levelScreen").style.display="block";
}

function endGame(){
    document.getElementById("gameScreen").innerHTML=
    "<h2>💀 Game Over</h2><p>Score: "+score+"</p><button onclick='location.reload()'>Restart</button>";
}

function showPopup(msg,type){
    let popup=document.getElementById("popup");
    popup.innerText=msg;
    popup.className="popup show "+type;

    setTimeout(()=>{popup.className="popup";},1500);
}

function generateQuestion(){
    let num,options=[],answers=[],text="";

    if(level===1){
        num=random(10,20);
        text="Find factors of "+num;
        for(let i=1;i<=10;i++){
            options.push(i);
            if(num%i===0) answers.push(i);
        }
    }

    else if(level===2){
        num=random(2,10);
        text="Find multiples of "+num;
        for(let i=1;i<=5;i++){
            let val=num*i;
            options.push(val);
            answers.push(val);
        }
        options.push(random(11,40));
    }

    else if(level===3){
        let a=random(10,20), b=random(10,20);
        text="Common factors of "+a+" & "+b;
        for(let i=1;i<=10;i++){
            options.push(i);
            if(a%i===0 && b%i===0) answers.push(i);
        }
    }

    else if(level===4){
        let type=random(1,3);

        if(type===1){
            let total=random(20,40);
            text="Riya has "+total+" chocolates. She wants to share equally. Select number of friends.";
            for(let i=1;i<=10;i++){
                options.push(i);
                if(total%i===0) answers.push(i);
            }
        }

        else if(type===2){
            let pack=random(2,6);
            text="Boxes have "+pack+" pencils. Select possible total pencils.";
            for(let i=1;i<=5;i++){
                let val=pack*i;
                options.push(val);
                answers.push(val);
            }
            options.push(random(11,40));
        }

        else{
            let a=random(12,24), b=random(12,24);
            text="Ribbons "+a+" cm & "+b+" cm cut equally. Select lengths.";
            for(let i=1;i<=10;i++){
                options.push(i);
                if(a%i===0 && b%i===0) answers.push(i);
            }
        }
    }

    return {text, options:shuffle(options), answers};
}

function random(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(arr){
    return arr.sort(()=>Math.random()-0.5);
}
</script>

</body>
</html>
