<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:linear-gradient(#89f7fe,#66a6ff);
}

.game-box{
    background:white;
    padding:20px;
    width:450px;
    margin:40px auto;
    border-radius:15px;
}

input{padding:10px;width:70%;}
button{padding:10px;margin:8px;cursor:pointer;}

.option{
    display:block;
    width:80%;
    margin:8px auto;
    background:#4CAF50;
    color:white;
}
.selected{background:orange;}
.locked{background:grey;}

/* PROGRESS */
#progressBar{
    background:#ddd;
    height:15px;
    border-radius:10px;
}
#progressFill{
    height:100%;
    width:0%;
    background:green;
    border-radius:10px;
}

/* POPUP */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:20px;
    border-radius:10px;
    display:none;
    color:white;
    font-size:18px;
}
.popup.correct{background:green;}
.popup.wrong{background:red;}

/* SHAKE */
@keyframes shake{
0%{transform:translate(0);}
25%{transform:translate(-5px);}
50%{transform:translate(5px);}
75%{transform:translate(-5px);}
100%{transform:translate(0);}
}
.shake{animation:shake 0.3s;}
</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<!-- START -->
<div id="startScreen">
<input id="playerName" placeholder="Enter name">
<br>
<button onclick="startGame()">Start</button>
</div>

<!-- LEVEL -->
<div id="levelScreen" style="display:none;">
<h2>🎯 Choose Level</h2>
<button onclick="startLevel(1)">Level 1 (Factors)</button><br>
<button id="lvl2" class="locked" onclick="startLevel(2)">Level 2 🔒</button><br>
<button id="lvl3" class="locked" onclick="startLevel(3)">Level 3 🔒</button><br>
<button id="lvl4" class="locked" onclick="startLevel(4)">Level 4 🔒</button><br>
<button id="boss" class="locked" onclick="startLevel(5)">👑 Boss 🔒</button>
</div>

<!-- GAME -->
<div id="gameScreen" style="display:none;">
<div id="progressBar"><div id="progressFill"></div></div>
<p id="stars">⭐ 0</p>
<p id="status"></p>
<p id="question"></p>
<div id="options"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>
</div>

</div>

<div id="popup" class="popup"></div>

<script>
let name="",level=1,unlocked=1,qIndex=0;
let answers=[],selected=[];
let score=0;
let attempts=0;
let timer,timeLeft=12;

/* START */
function startGame(){
    name=document.getElementById("playerName").value.trim();
    if(name===""){showPopup("Enter name","wrong");return;}

    startScreen.style.display="none";
    levelScreen.style.display="block";
}

/* LEVEL */
function startLevel(l){
    if(l>unlocked){showPopup("Locked","wrong");return;}

    level=l;qIndex=0;
    progressFill.style.width="0%";

    levelScreen.style.display="none";
    gameScreen.style.display="block";

    loadQ();
}

/* LOAD QUESTIONS */
function loadQ(){
    selected=[];
    attempts=0;
    nextBtn.style.display="none";

    let text="",opts=[],ans=[];

    if(level===1){
        let num=Math.floor(Math.random()*10)+10;
        text="Select all factors of "+num;

        for(let i=1;i<=12;i++){
            opts.push(i);
            if(num%i===0) ans.push(i);
        }
    }

    else if(level===2){
        let n=Math.floor(Math.random()*5)+2;
        text="Select multiples of "+n;

        for(let i=1;i<=4;i++){
            let v=n*i;
            opts.push(v); ans.push(v);
        }

        while(opts.length<8){
            let wrong=Math.floor(Math.random()*30)+2;
            if(wrong%n!==0 && !opts.includes(wrong)){
                opts.push(wrong);
            }
        }
    }

    else if(level===3){
        let a=12+Math.floor(Math.random()*10);
        let b=18+Math.floor(Math.random()*10);

        text="Find HCF of "+a+" & "+b;

        function hcf(x,y){while(y){let t=y;y=x%y;x=t;}return x;}
        let c=hcf(a,b);

        ans=[c];
        opts=[c,c+1,c+2,c-1].filter(v=>v>0);
    }

    else if(level===4){
        let a=3+Math.floor(Math.random()*6);
        let b=4+Math.floor(Math.random()*6);

        text="Find LCM of "+a+" & "+b;

        function lcm(x,y){let m=Math.max(x,y);while(true){if(m%x===0&&m%y===0)return m;m++;}}
        let c=lcm(a,b);

        ans=[c];
        opts=[c,c+2,c+4,c-2].filter(v=>v>0);
    }

    // 👑 BOSS LEVEL WITH STORIES
    else{
        let stories = [
            () => {
                let a=3,b=4;
                return {
                    q:`👑 Two lights blink every ${a} and ${b} minutes. When together?`,
                    a:lcm(a,b)
                };
            },
            () => {
                let a=2,b=5;
                return {
                    q:`👑 Two buses arrive every ${a} and ${b} mins. When together?`,
                    a:lcm(a,b)
                };
            },
            () => {
                let a=4,b=6;
                return {
                    q:`👑 Two students clap every ${a} and ${b} seconds. When together?`,
                    a:lcm(a,b)
                };
            }
        ];

        function lcm(x,y){
            let m=Math.max(x,y);
            while(true){
                if(m%x===0 && m%y===0) return m;
                m++;
            }
        }

        let story = stories[Math.floor(Math.random()*stories.length)]();
        text = story.q;

        ans=[story.a];
        opts=[story.a, story.a+2, story.a+4, story.a-2].filter(v=>v>0);
    }

    answers=ans;
    question.innerText=text;

    opts.sort(()=>Math.random()-0.5);

    let html="";
    opts.forEach(o=>{
        html+=`<button class="option" onclick="selectOption(this,${o})">${o}</button>`;
    });

    options.innerHTML=html;
    updateStatus();
}

/* STATUS */
function updateStatus(){
    status.innerText="Level "+level+" Q"+(qIndex+1)+"/3";
}

/* SELECT */
function selectOption(btn,val){
    if(selected.includes(val)){
        selected=selected.filter(v=>v!==val);
        btn.classList.remove("selected");
    }else{
        selected.push(val);
        btn.classList.add("selected");
    }
}

/* CHECK */
function checkAnswer(){
    let correct = answers.every(a=>selected.includes(a)) &&
                  selected.every(s=>answers.includes(s));

    if(correct){
        score+=10;
        stars.innerText="⭐ "+score;
        showPopup("Correct 🎉","correct");
        nextBtn.style.display="inline";
    }
    else{
        attempts++;

        if(attempts>=2){
            showPopup("Answer shown","correct");

            document.querySelectorAll(".option").forEach(btn=>{
                let val=parseInt(btn.innerText);

                if(answers.includes(val)) btn.style.background="green";
                else if(selected.includes(val)) btn.style.background="red";

                btn.disabled=true;
            });

            nextBtn.style.display="inline";
            return;
        }

        showPopup("Try Again","wrong");
    }
}

/* NEXT */
function nextQuestion(){
    qIndex++;

    let percent=(qIndex/3)*100;
    progressFill.style.width=percent+"%";

    if(qIndex===3){
        unlocked++;

        if(unlocked>=2) lvl2.classList.remove("locked");
        if(unlocked>=3) lvl3.classList.remove("locked");
        if(unlocked>=4) lvl4.classList.remove("locked");
        if(unlocked>=5) boss.classList.remove("locked");

        showPopup("Level Complete","correct");

        gameScreen.style.display="none";
        levelScreen.style.display="block";
    }
    else loadQ();
}

/* POPUP */
function showPopup(msg,type){
    let p=document.getElementById("popup");
    p.classList.remove("correct","wrong");
    if(type==="correct") p.classList.add("correct");
    if(type==="wrong") p.classList.add("wrong");
    p.innerText=msg;
    p.style.display="block";
    setTimeout(()=>p.style.display="none",1200);
}
</script>

</body>
</html>
