<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:linear-gradient(#89f7fe,#66a6ff);
}

.game-box{
    background:white;
    padding:20px;
    width:450px;
    margin:40px auto;
    border-radius:15px;
    position:relative;
}

input{padding:10px;width:70%;}
button{padding:10px;margin:8px;cursor:pointer;}

.option{
    display:block;
    width:80%;
    margin:8px auto;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:8px;
}
.option:hover{opacity:0.8;}

.selected{background:orange;}
.locked{background:grey;pointer-events:none;}

#progressBar{
    background:#ddd;
    height:15px;
    border-radius:10px;
}
#progressFill{
    height:100%;
    width:0%;
    background:green;
    border-radius:10px;
}

/* POPUP FIX (no blocking clicks) */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:20px;
    border-radius:10px;
    display:none;
    color:white;
    font-size:18px;
    z-index:10;
    pointer-events:none; /* IMPORTANT FIX */
}
.popup.correct{background:green;}
.popup.wrong{background:red;}

</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<div id="startScreen">
<input id="playerName" placeholder="Enter name">
<br>
<button onclick="startGame()">Start</button>
</div>

<div id="levelScreen" style="display:none;">
<h2>Choose Level</h2>
<button onclick="startLevel(1)">Level 1</button><br>
<button id="lvl2" class="locked" onclick="startLevel(2)">Level 2</button><br>
<button id="lvl3" class="locked" onclick="startLevel(3)">Level 3</button><br>
<button id="lvl4" class="locked" onclick="startLevel(4)">Level 4</button><br>
<button id="boss" class="locked" onclick="startLevel(5)">Boss</button>
</div>

<div id="gameScreen" style="display:none;">
<div id="progressBar"><div id="progressFill"></div></div>
<p id="status"></p>
<p id="question"></p>
<div id="options"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>
</div>

</div>

<div id="popup" class="popup"></div>

<script>
let level=1,unlocked=1,qIndex=0;
let answers=[],selected=[];
let attempts=0;

/* START */
function startGame(){
    let name=document.getElementById("playerName").value.trim();
    if(name===""){showPopup("Enter name","wrong");return;}

    startScreen.style.display="none";
    levelScreen.style.display="block";
}

/* LEVEL */
function startLevel(l){
    if(l>unlocked){showPopup("Locked","wrong");return;}

    level=l;qIndex=0;
    progressFill.style.width="0%";

    levelScreen.style.display="none";
    gameScreen.style.display="block";

    loadQ();
}

/* LOAD */
function loadQ(){
    selected=[];
    attempts=0;
    nextBtn.style.display="none";

    let text="",opts=[],ans=[];

    if(level===1){
        let num=12;
        text="Select all factors of "+num;
        for(let i=1;i<=12;i++){
            opts.push(i);
            if(num%i===0) ans.push(i);
        }
    }

    else if(level===2){
        let n=3;
        text="Select multiples of "+n;

        opts=[3,6,9,12,7,10,14,11];
        ans=[3,6,9,12];
    }

    else{
        text="Find LCM of 3 & 4";
        ans=[12];
        opts=[12,14,10,8];
    }

    answers=ans;
    question.innerText=text;

    let html="";
    opts.forEach(o=>{
        html+=`<button class="option" onclick="selectOption(this,${o})">${o}</button>`;
    });

    options.innerHTML=html;
}

/* SELECT FIXED */
function selectOption(btn,val){
    if(btn.disabled) return; // prevent if locked

    if(selected.includes(val)){
        selected=selected.filter(v=>v!==val);
        btn.classList.remove("selected");
    }else{
        selected.push(val);
        btn.classList.add("selected");
    }
}

/* CHECK */
function checkAnswer(){
    let correct = answers.every(a=>selected.includes(a)) &&
                  selected.every(s=>answers.includes(s));

    if(correct){
        showPopup("Correct","correct");
        nextBtn.style.display="inline";
    }
    else{
        attempts++;

        if(attempts>=2){
            showPopup("Answer shown","correct");

            document.querySelectorAll(".option").forEach(btn=>{
                let val=parseInt(btn.innerText);

                if(answers.includes(val)){
                    btn.style.background="green";
                }else if(selected.includes(val)){
                    btn.style.background="red";
                }

                btn.disabled=true;
            });

            nextBtn.style.display="inline";
            return;
        }

        showPopup("Try Again","wrong");
    }
}

/* NEXT */
function nextQuestion(){
    qIndex++;

    if(qIndex===3){
        unlocked++;
        lvl2.classList.remove("locked");
        showPopup("Level Complete","correct");

        gameScreen.style.display="none";
        levelScreen.style.display="block";
    }
    else loadQ();
}

/* POPUP */
function showPopup(msg,type){
    let p=document.getElementById("popup");
    p.classList.remove("correct","wrong");
    p.classList.add(type);
    p.innerText=msg;
    p.style.display="block";
    setTimeout(()=>p.style.display="none",1000);
}
</script>

</body>
</html>
