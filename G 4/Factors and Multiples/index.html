<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body {
    font-family: 'Comic Sans MS';
    text-align: center;
    background: linear-gradient(-45deg,#fddb92,#a1c4fd,#fbc2eb);
    background-size:400% 400%;
    animation:bg 8s infinite;
}
@keyframes bg {
    0%{background-position:0%}
    50%{background-position:100%}
    100%{background-position:0%}
}

.game-box {
    background:white;
    padding:20px;
    border-radius:20px;
    width:420px;
    margin:auto;
    margin-top:30px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

button {
    padding:12px;
    margin:8px;
    border-radius:10px;
    border:none;
    cursor:pointer;
}

.option {
    background:#4CAF50;
    color:white;
    width:85%;
    display:block;
    margin:10px auto;
}

.selected{background:orange!important;}
.correct{background:#2ecc71!important;}
.wrong{background:#e74c3c!important;}
.locked{background:grey;}

.popup {
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.5);
    padding:25px 40px;
    border-radius:15px;
    font-size:22px;
    color:white;
    opacity:0;
    z-index:1000;
    transition:0.4s;
}
.popup.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.1);
}
.popup.hide{
    opacity:0;
    transform:translate(-50%,-50%) scale(0.6);
}
.popup.correct{background:#2ecc71;}
.popup.wrong{background:#e74c3c;}
.popup.boss{background:purple;}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    top:0;
    left:0;
    opacity:0;
    transition:0.3s;
    z-index:999;
}
.overlay.show{opacity:1;}

@keyframes shake{
    0%{transform:translate(0,0);}
    25%{transform:translate(-5px,5px);}
    50%{transform:translate(5px,-5px);}
    75%{transform:translate(-5px,-5px);}
    100%{transform:translate(0,0);}
}
.shake{animation:shake 0.4s;}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:50%;
    left:50%;
    animation:explode 1s forwards;
}
@keyframes explode{
    to{
        transform:translate(var(--x),var(--y));
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<div id="startScreen">
<input type="text" id="playerName" placeholder="Enter your name"><br>
<button onclick="startGame()">Start</button>
</div>

<div id="avatarScreen" style="display:none;">
<h3>Select Avatar</h3>
<button onclick="selectAvatar('🧑‍🚀')">🧑‍🚀</button>
<button onclick="selectAvatar('🦸‍♂️')">🦸‍♂️</button>
<button onclick="selectAvatar('👩‍🎓')">👩‍🎓</button>
<button onclick="selectAvatar('🧙‍♂️')">🧙‍♂️</button>
<br>
<button onclick="goToLevels()">Continue</button>
</div>

<div id="levelScreen" style="display:none;">
<h3>Select Level</h3>
<button onclick="startLevel(1)">Level 1</button>
<button onclick="startLevel(2)" id="lvl2" class="locked">Level 2 🔒</button>
<button onclick="startLevel(3)" id="lvl3" class="locked">Level 3 🔒</button>
<button onclick="startLevel(4)" id="lvl4" class="locked">Boss 👑 🔒</button>
</div>

<div id="gameScreen" style="display:none;">
<p id="info"></p>
<p id="question"></p>
<div id="options"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>

<p id="score"></p>
</div>

</div>

<div id="overlay" class="overlay"></div>
<div id="popup" class="popup"></div>

<!-- AUDIO -->
<audio id="correctSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="wrongSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>
<audio id="levelSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>
<audio id="bgMusic" loop src="https://www.bensound.com/bensound-music/bensound-funkyelement.mp3"></audio>

<script>
let name="",avatar="😀",level=1,qIndex=0,score=0,lives=3;
let unlockedLevel=1,currentAnswers=[],selected=[];

function startGame(){
    name=document.getElementById("playerName").value;
    if(name===""){showPopup("Enter name","wrong");return;}
    document.getElementById("bgMusic").play();
    document.getElementById("startScreen").style.display="none";
    document.getElementById("avatarScreen").style.display="block";
}

function selectAvatar(a){avatar=a;showPopup("Avatar "+a,"correct");}
function goToLevels(){
    document.getElementById("avatarScreen").style.display="none";
    document.getElementById("levelScreen").style.display="block";
}

function startLevel(lvl){
    if(lvl>unlockedLevel)return;
    level=lvl;qIndex=0;score=0;lives=3;

    if(level===4)showPopup("⚠ BOSS LEVEL","boss");

    document.getElementById("levelScreen").style.display="none";
    document.getElementById("gameScreen").style.display="block";
    loadQuestion();
}

function loadQuestion(){
    selected=[];
    document.getElementById("nextBtn").style.display="none";

    document.getElementById("info").innerText=
    avatar+" "+name+" | ❤️"+lives+" | L"+level+" Q"+(qIndex+1)+"/3 | ⭐"+score;

    let q=generateQuestion();
    document.getElementById("question").innerText=q.text;

    let html="";
    q.options.forEach(o=>{
        html+=`<button class="option" onclick="selectOption(this,${o})">${o}</button>`;
    });
    document.getElementById("options").innerHTML=html;

    currentAnswers=q.answers;
}

function selectOption(btn,val){
    if(selected.includes(val)){
        selected=selected.filter(v=>v!==val);
        btn.classList.remove("selected");
    }else{
        selected.push(val);
        btn.classList.add("selected");
    }
}

function checkAnswer(){
    let all=currentAnswers.every(a=>selected.includes(a));
    let noExtra=selected.every(s=>currentAnswers.includes(s));

    if(all && noExtra){
        document.getElementById("correctSound").play();
        score+=10;
        showPopup("Correct!","correct");
        createConfetti();
        document.getElementById("nextBtn").style.display="inline";
    }else{
        document.getElementById("wrongSound").play();
        lives--;
        showPopup("Try Again!","wrong");

        document.querySelector(".game-box").classList.add("shake");
        setTimeout(()=>document.querySelector(".game-box").classList.remove("shake"),400);

        if(lives===0)endGame();
    }
}

function nextQuestion(){
    qIndex++;
    if(qIndex===3){unlock();return;}
    loadQuestion();
}

function unlock(){
    document.getElementById("levelSound").play();

    if(level===1){unlockedLevel=2;lvl2.classList.remove("locked");}
    if(level===2){unlockedLevel=3;lvl3.classList.remove("locked");}
    if(level===3){unlockedLevel=4;lvl4.classList.remove("locked");}

    showPopup("Level Complete!","correct");

    document.getElementById("gameScreen").style.display="none";
    document.getElementById("levelScreen").style.display="block";
}

function endGame(){
    document.getElementById("bgMusic").pause();

    document.getElementById("gameScreen").innerHTML=
    `<div style="border:5px solid gold;padding:20px;border-radius:15px;">
    <h2>🏅 Certificate</h2>
    <h1>${avatar} ${name}</h1>
    <p>Completed Math Adventure</p>
    <h3>Score: ${score}</h3>
    <button onclick="location.reload()">Play Again</button>
    </div>`;
}

function showPopup(msg,type){
    let p=document.getElementById("popup");
    let o=document.getElementById("overlay");

    p.innerText=msg;
    o.classList.add("show");
    p.className="popup show "+type;

    setTimeout(()=>{p.className="popup hide "+type;o.classList.remove("show");},1200);
    setTimeout(()=>{p.className="popup";},1700);
}

function createConfetti(){
    for(let i=0;i<20;i++){
        let d=document.createElement("div");
        d.className="confetti";
        d.style.setProperty('--x',(Math.random()*400-200)+"px");
        d.style.setProperty('--y',(Math.random()*400-200)+"px");
        d.style.background="hsl("+Math.random()*360+",100%,50%)";
        document.body.appendChild(d);
        setTimeout(()=>d.remove(),1000);
    }
}

function generateQuestion(){
    let num,options=[],answers=[],text="";

    if(level===1){
        num=random(10,20);
        text="Factors of "+num;
        for(let i=1;i<=10;i++){options.push(i);if(num%i===0)answers.push(i);}
    }
    else if(level===2){
        num=random(2,10);
        text="Multiples of "+num;
        for(let i=1;i<=5;i++){let v=num*i;options.push(v);answers.push(v);}
        options.push(random(11,40));
    }
    else if(level===3){
        let a=random(10,20),b=random(10,20);
        text="Common factors of "+a+" & "+b;
        for(let i=1;i<=10;i++){options.push(i);if(a%i===0&&b%i===0)answers.push(i);}
    }
    else if(level===4){
        let type=random(1,3);

        if(type===1){
            let t=random(20,40);
            text="Share "+t+" chocolates equally. Friends?";
            for(let i=1;i<=10;i++){options.push(i);if(t%i===0)answers.push(i);}
        }
        else if(type===2){
            let p=random(2,6);
            text="Boxes of "+p+" pencils. Total?";
            for(let i=1;i<=5;i++){let v=p*i;options.push(v);answers.push(v);}
            options.push(random(11,40));
        }
        else{
            let a=random(12,24),b=random(12,24);
            text="Ribbons "+a+" & "+b+". Equal lengths?";
            for(let i=1;i<=10;i++){options.push(i);if(a%i===0&&b%i===0)answers.push(i);}
        }
    }

    return {text,options:shuffle(options),answers};
}

function random(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function shuffle(a){return a.sort(()=>Math.random()-0.5);}
</script>

</body>
</html>
