<!DOCTYPE html>
<html>
<head>
<title>Factor & Multiple Adventure</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background: linear-gradient(120deg, #89f7fe, #66a6ff);
}

.game-box {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 420px;
    margin: auto;
    margin-top: 40px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
}

button {
    margin: 6px;
    padding: 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

.option {
    background: #2196F3;
    color: white;
    width: 80%;
    display: block;
    margin: 8px auto;
}

.selected {
    background: orange !important;
}

#nextBtn {
    background: green;
    color: white;
}

#hint {
    color: orange;
}
</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Factor & Multiple Adventure</h2>

<div id="startScreen">
<input type="text" id="playerName" placeholder="Enter your name"><br><br>
<button onclick="startGame()">Start Game</button><br><br>
<button onclick="toggleTeacher()">Teacher Mode</button>
</div>

<div id="gameScreen" style="display:none;">
<p id="info"></p>
<p id="question"></p>

<div id="options"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>

<p id="hint"></p>
<button onclick="showHint()">Hint</button>

<p id="score"></p>
</div>

</div>

<script>
let name = "";
let level = 1;
let qIndex = 0;
let score = 0;
let lives = 3;
let teacherMode = false;

let currentAnswers = [];
let selected = [];

function startGame() {
    name = document.getElementById("playerName").value;
    if (name.trim() === "") {
        alert("Enter your name!");
        return;
    }

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    loadQuestion();
}

function toggleTeacher() {
    teacherMode = !teacherMode;
    alert("Teacher Mode: " + (teacherMode ? "ON" : "OFF"));
}

function loadQuestion() {
    selected = [];
    document.getElementById("nextBtn").style.display = "none";

    document.getElementById("info").innerText =
        name + " | Level: " + level + " | ❤️ " + lives;

    let q = generateQuestion();

    document.getElementById("question").innerText = q.text;

    let html = "";
    q.options.forEach(opt => {
        html += `<button class="option" onclick="selectOption(this, ${opt})">${opt}</button>`;
    });

    document.getElementById("options").innerHTML = html;

    currentAnswers = q.answers;
    window.currentHint = q.hint;

    if (teacherMode) {
        document.getElementById("hint").innerText =
            "Answer: " + currentAnswers.join(", ");
    } else {
        document.getElementById("hint").innerText = "";
    }

    document.getElementById("score").innerText =
        "Score: " + score + " | Question: " + (qIndex+1) + "/3";
}

function selectOption(btn, value) {
    if (selected.includes(value)) {
        selected = selected.filter(v => v !== value);
        btn.classList.remove("selected");
    } else {
        selected.push(value);
        btn.classList.add("selected");
    }
}

function checkAnswer() {
    let correct =
        selected.length === currentAnswers.length &&
        selected.every(v => currentAnswers.includes(v));

    if (correct) {
        score += 10;
        alert("Correct!");
    } else {
        lives--;
        alert("Try again!");
    }

    document.getElementById("nextBtn").style.display = "inline";

    if (lives === 0) {
        endGame();
    }
}

function nextQuestion() {
    qIndex++;

    if (qIndex === 3) {
        level++;
        qIndex = 0;
    }

    loadQuestion();
}

function endGame() {
    document.getElementById("gameScreen").innerHTML =
        "<h2>Game Over</h2><p>Final Score: " + score + "</p>";
}

function showHint() {
    document.getElementById("hint").innerText = currentHint;
}

function generateQuestion() {
    let num, options = [], answers = [], hint = "", text="";

    if (level === 1) {
        num = random(10,20);
        text = "Select factors of " + num;

        for (let i=1;i<=10;i++) {
            options.push(i);
            if (num % i === 0) answers.push(i);
        }
        hint = "Factors divide the number exactly";
    }

    else if (level === 2) {
        num = random(2,10);
        text = "Select multiples of " + num;

        for (let i=1;i<=5;i++) {
            let val = num*i;
            options.push(val);
            answers.push(val);
        }
        options.push(random(11,40), random(11,40));
        hint = "Multiples = number × 1,2,3...";
    }

    else if (level === 3) {
        let a = random(10,20);
        let b = random(10,20);
        text = "Common factors of " + a + " & " + b;

        for (let i=1;i<=10;i++) {
            options.push(i);
            if (a%i===0 && b%i===0) answers.push(i);
        }
        hint = "Find numbers dividing both numbers";
    }

    else {
        endGame();
        return;
    }

    return {
        text: text,
        options: shuffle(options),
        answers: answers,
        hint: hint
    };
}

function random(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(arr){
    return arr.sort(()=>Math.random()-0.5);
}
</script>

</body>
</html>
