<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: linear-gradient(#a1c4fd,#fbc2eb);
}

/* GAME BOX */
.game-box {
    background:white;
    padding:20px;
    border-radius:15px;
    width:400px;
    margin:50px auto;
}

/* INPUT FIX */
input {
    padding:12px;
    width:80%;
    font-size:16px;
    margin:10px;
}

/* BUTTONS */
button {
    padding:10px 15px;
    margin:8px;
    cursor:pointer;
}

/* OPTIONS */
.option {
    display:block;
    width:80%;
    margin:8px auto;
    background:#4CAF50;
    color:white;
}

.selected{background:orange;}
.correct{background:green;}
.wrong{background:red;}

/* POPUP CENTER */
.popup {
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:black;
    color:white;
    padding:20px;
    border-radius:10px;
    display:none;
}

/* SHAKE */
@keyframes shake {
    0%{transform:translate(0,0);}
    25%{transform:translate(-5px,5px);}
    50%{transform:translate(5px,-5px);}
    75%{transform:translate(-5px,-5px);}
    100%{transform:translate(0,0);}
}
.shake{animation:shake 0.3s;}
</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<!-- START -->
<div id="startScreen">
<input id="playerName" placeholder="Enter your name">
<br>
<button onclick="startGame()">Start</button>
</div>

<!-- GAME -->
<div id="gameScreen" style="display:none;">
<p id="question"></p>
<div id="options"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>
</div>

</div>

<div id="popup" class="popup"></div>

<script>
let name="",answers=[],selected=[],qIndex=0;

/* 🔥 FORCE FOCUS AFTER PAGE LOAD */
window.onload = function(){
    document.getElementById("playerName").focus();
};

/* ENTER KEY SUPPORT */
document.getElementById("playerName").addEventListener("keydown",function(e){
    if(e.key==="Enter"){startGame();}
});

/* START GAME */
function startGame(){
    name = document.getElementById("playerName").value.trim();

    if(name===""){
        showPopup("Enter your name!");
        return;
    }

    document.getElementById("startScreen").style.display="none";
    document.getElementById("gameScreen").style.display="block";

    loadQuestion();
}

/* LOAD QUESTION */
function loadQuestion(){
    selected=[];
    document.getElementById("nextBtn").style.display="none";

    let num = Math.floor(Math.random()*10)+10;
    let text = "Select factors of "+num;

    let opts=[];
    let ans=[];

    for(let i=1;i<=10;i++){
        opts.push(i);
        if(num%i===0) ans.push(i);
    }

    answers=ans;

    document.getElementById("question").innerText=text;

    let html="";
    opts.forEach(o=>{
        html+=`<button class="option" onclick="selectOption(this,${o})">${o}</button>`;
    });

    document.getElementById("options").innerHTML=html;
}

/* SELECT */
function selectOption(btn,val){
    if(selected.includes(val)){
        selected=selected.filter(v=>v!==val);
        btn.classList.remove("selected");
    }else{
        selected.push(val);
        btn.classList.add("selected");
    }
}

/* CHECK */
function checkAnswer(){
    let correct = answers.every(a=>selected.includes(a)) &&
                  selected.every(s=>answers.includes(s));

    if(correct){
        showPopup("Correct!");
        document.getElementById("nextBtn").style.display="inline";
    } else {
        showPopup("Try Again!");

        document.querySelector(".game-box").classList.add("shake");

        let btns=document.querySelectorAll(".option");

        btns.forEach(btn=>{
            let v=Number(btn.innerText);
            if(answers.includes(v)) btn.classList.add("correct");
            else if(selected.includes(v)) btn.classList.add("wrong");
        });

        setTimeout(()=>{
            btns.forEach(b=>b.classList.remove("correct","wrong","selected"));
            selected=[];
            document.querySelector(".game-box").classList.remove("shake");
        },1500);
    }
}

/* NEXT */
function nextQuestion(){
    loadQuestion();
}

/* POPUP */
function showPopup(msg){
    let p=document.getElementById("popup");
    p.innerText=msg;
    p.style.display="block";

    setTimeout(()=>p.style.display="none",1000);
}
</script>

</body>
</html>
