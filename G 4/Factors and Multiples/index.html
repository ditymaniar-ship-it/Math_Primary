<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:linear-gradient(#89f7fe,#66a6ff);
}

.game-box{
    background:white;
    padding:20px;
    width:520px;
    margin:40px auto;
    border-radius:15px;
}

/* INPUT */
input{padding:10px;width:70%;}

/* OPTIONS */
.option{
    display:block;
    width:80%;
    margin:8px auto;
    background:#4CAF50;
    color:white;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
.selected{background:orange;}
.locked{pointer-events:none;background:grey;}

/* LEVEL CARDS */
.level-container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.level-card{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    padding:20px;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

.level-card:hover{transform:scale(1.05);}

.level-card.locked{
    background:grey;
    color:white;
    pointer-events:none;
}

.level-card.boss{
    background:linear-gradient(135deg,#f7971e,#ffd200);
    grid-column:span 2;
}

/* POPUP */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:20px;
    border-radius:10px;
    display:none;
    color:white;
    z-index:10;
}
.popup.correct{background:green;}
.popup.wrong{background:red;}

/* PROGRESS */
#progressBar{background:#ddd;height:10px;border-radius:10px;}
#progressFill{height:100%;width:0%;background:green;}
</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<!-- START -->
<div id="startScreen">
<input id="playerName" placeholder="Enter name">
<br><br>
<button onclick="startGame()">Start</button>
</div>

<!-- LEVEL SCREEN -->
<div id="levelScreen" style="display:none;">
<h3>🌟 Choose Your Mission</h3>

<div class="level-container">

<div class="level-card" onclick="startLevel(1)">
Level 1<br>Factors ⭐
</div>

<div id="lvl2" class="level-card locked" onclick="startLevel(2)">
Level 2<br>Multiples 🔒
</div>

<div id="lvl3" class="level-card locked" onclick="startLevel(3)">
Level 3<br>HCF 🔒
</div>

<div id="lvl4" class="level-card locked" onclick="startLevel(4)">
Level 4<br>LCM 🔒
</div>

<div id="boss" class="level-card boss locked" onclick="startLevel(5)">
👑 Boss Level 🔒
</div>

</div>
</div>

<!-- GAME -->
<div id="gameScreen" style="display:none;">
<p id="status"></p>
<p id="question"></p>
<div id="options"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>
</div>

</div>

<div id="popup" class="popup"></div>

<script>

let level=1,unlocked=1,qIndex=0;
let answers=[],selected=[],attempts=0;
let usedQuestions=[];

/* START */
function startGame(){
    let name=document.getElementById("playerName").value.trim();
    if(name===""){showPopup("Enter name","wrong");return;}

    document.getElementById("startScreen").style.display="none";
    document.getElementById("levelScreen").style.display="block";
}

/* LEVEL */
function startLevel(l){
    if(l>unlocked){showPopup("Locked","wrong");return;}

    level=l;
    qIndex=0;
    usedQuestions=[];

    document.getElementById("levelScreen").style.display="none";
    document.getElementById("gameScreen").style.display="block";

    loadQ();
}

/* LOAD QUESTIONS */
function loadQ(){
    selected=[]; attempts=0;
    document.getElementById("nextBtn").style.display="none";

    let text="",opts=[],ans=[],key="";

    function used(k){return usedQuestions.includes(k);}
    function save(k){usedQuestions.push(k);}

    if(level===1){
        let num;
        do{
            num=6+Math.floor(Math.random()*20);
            key="F"+num;
        }while(used(key));
        save(key);

        text="Select factors of "+num;

        for(let i=1;i<=num;i++){
            opts.push(i);
            if(num%i===0) ans.push(i);
        }
    }

    else if(level===2){
        let n;
        do{
            n=2+Math.floor(Math.random()*6);
            key="M"+n;
        }while(used(key));
        save(key);

        text="Select multiples of "+n;

        for(let i=1;i<=4;i++){
            let v=n*i;
            opts.push(v); ans.push(v);
        }

        while(opts.length<8){
            let w=Math.floor(Math.random()*40)+2;
            if(w%n!==0 && !opts.includes(w)) opts.push(w);
        }
    }

    else if(level===3){
        let a=10+Math.floor(Math.random()*20);
        let b=10+Math.floor(Math.random()*20);

        function hcf(x,y){while(y){let t=y;y=x%y;x=t;}return x;}
        let c=hcf(a,b);

        text=`Find HCF of ${a} & ${b}`;
        ans=[c];
        opts=[c,c+1,c+2,c-1].filter(v=>v>0);
    }

    else if(level===4){
        let a=3+Math.floor(Math.random()*6);
        let b=4+Math.floor(Math.random()*6);

        function lcm(x,y){
            let m=Math.max(x,y);
            while(true){
                if(m%x===0 && m%y===0) return m;
                m++;
            }
        }

        let c=lcm(a,b);

        text=`Find LCM of ${a} & ${b}`;
        ans=[c];
        opts=[c,c+2,c+4,c-2].filter(v=>v>0);
    }

    else{
        let stories=[
            {q:"👑 Lights blink every 3 & 4 mins. When together?",a:12},
            {q:"👑 Buses every 2 & 5 mins. When together?",a:10},
            {q:"👑 Claps every 4 & 6 sec. When together?",a:12}
        ];

        let s=stories[Math.floor(Math.random()*stories.length)];

        text=s.q;
        ans=[s.a];
        opts=[s.a,s.a+2,s.a+4,s.a-2].filter(v=>v>0);
    }

    answers=ans;

    document.getElementById("question").innerText=text;
    document.getElementById("status").innerText=`Level ${level} | Q${qIndex+1}/3`;

    opts.sort(()=>Math.random()-0.5);

    let optDiv=document.getElementById("options");
    optDiv.innerHTML="";

    opts.forEach(o=>{
        let btn=document.createElement("button");
        btn.className="option";
        btn.innerText=o;

        btn.onclick=function(){
            if(selected.includes(o)){
                selected=selected.filter(v=>v!==o);
                btn.classList.remove("selected");
            }else{
                selected.push(o);
                btn.classList.add("selected");
            }
        };

        optDiv.appendChild(btn);
    });
}

/* CHECK */
function checkAnswer(){
    let correct=answers.every(a=>selected.includes(a)) &&
                selected.every(s=>answers.includes(s));

    if(correct){
        showPopup("Correct 🎉","correct");

        if(level===5){
            showPopup("🏆 CONGRATULATIONS!","correct");
            confetti();
        }

        document.getElementById("nextBtn").style.display="inline";
    }else{
        attempts++;

        if(attempts>=2){
            showPopup("Answer shown","correct");

            document.querySelectorAll(".option").forEach(b=>{
                let v=parseInt(b.innerText);
                if(answers.includes(v)) b.style.background="green";
                else if(selected.includes(v)) b.style.background="red";
                b.disabled=true;
            });

            document.getElementById("nextBtn").style.display="inline";
            return;
        }

        showPopup("Try Again","wrong");
    }
}

/* NEXT */
function nextQuestion(){
    qIndex++;

    if(qIndex===3){
        unlocked++;

        if(unlocked>=2) document.getElementById("lvl2").classList.remove("locked");
        if(unlocked>=3) document.getElementById("lvl3").classList.remove("locked");
        if(unlocked>=4) document.getElementById("lvl4").classList.remove("locked");
        if(unlocked>=5) document.getElementById("boss").classList.remove("locked");

        document.getElementById("gameScreen").style.display="none";
        document.getElementById("levelScreen").style.display="block";
    }
    else loadQ();
}

/* POPUP */
function showPopup(msg,type){
    let p=document.getElementById("popup");
    p.className="popup "+type;
    p.innerText=msg;
    p.style.display="block";
    setTimeout(()=>p.style.display="none",1000);
}

/* CONFETTI */
function confetti(){
    for(let i=0;i<40;i++){
        let c=document.createElement("div");
        c.style.position="fixed";
        c.style.width="6px";
        c.style.height="6px";
        c.style.background="red";
        c.style.left=Math.random()*100+"%";
        c.style.top="-10px";

        document.body.appendChild(c);

        let fall=setInterval(()=>{
            c.style.top=parseInt(c.style.top)+5+"px";
            if(parseInt(c.style.top)>window.innerHeight){
                clearInterval(fall);
                c.remove();
            }
        },30);
    }
}

</script>

</body>
</html>
