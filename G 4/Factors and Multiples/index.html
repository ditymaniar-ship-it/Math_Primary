<!DOCTYPE html>
<html>
<head>
<title>Math Adventure</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:linear-gradient(#a1c4fd,#fbc2eb);
}

.game-box{
    background:white;
    padding:20px;
    width:420px;
    margin:40px auto;
    border-radius:15px;
}

input{padding:10px;width:70%;}
button{padding:10px;margin:8px;cursor:pointer;}

.option{
    display:block;
    width:80%;
    margin:8px auto;
    background:#4CAF50;
    color:white;
}

.selected{background:orange;}
.correct{background:green;}
.wrong{background:red;}
.locked{background:grey;}

#levelScreen{
    background:#fff3cd;
    padding:20px;
    border-radius:10px;
}

/* PROGRESS BAR */
#progressBar{
    background:#ddd;
    height:15px;
    border-radius:10px;
    margin-bottom:10px;
}
#progressFill{
    height:100%;
    width:0%;
    background:green;
    border-radius:10px;
}

/* POPUP */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.8);
    padding:20px;
    border-radius:10px;
    display:none;
    color:white;
    font-size:18px;
    animation:pop 0.3s ease;
}
.popup.correct{background:green;}
.popup.wrong{background:red;}

@keyframes pop{
    from{transform:translate(-50%,-50%) scale(0.5);}
    to{transform:translate(-50%,-50%) scale(1);}
}

/* SHAKE */
@keyframes shake{
0%{transform:translate(0,0);}
25%{transform:translate(-5px,5px);}
50%{transform:translate(5px,-5px);}
75%{transform:translate(-5px,-5px);}
100%{transform:translate(0,0);}
}
.shake{animation:shake 0.3s;}
</style>
</head>

<body>

<div class="game-box">

<h2>🎮 Math Adventure</h2>

<!-- START -->
<div id="startScreen">
<input id="playerName" placeholder="Enter name" autofocus>
<br>
<button onclick="startGame()">Start</button>
</div>

<!-- LEVEL -->
<div id="levelScreen" style="display:none;">
<h2>🎯 Choose Level</h2>
<button onclick="startLevel(1)">Level 1</button><br>
<button id="lvl2" class="locked" onclick="startLevel(2)">Level 2 🔒</button><br>
<button id="lvl3" class="locked" onclick="startLevel(3)">Level 3 🔒</button><br>
<button id="lvl4" class="locked" onclick="startLevel(4)">👑 Boss 🔒</button>
</div>

<!-- GAME -->
<div id="gameScreen" style="display:none;">

<div id="progressBar">
<div id="progressFill"></div>
</div>

<p id="stars">⭐ 0</p>
<p id="status"></p>
<p id="question"></p>
<div id="options"></div>

<button onclick="checkAnswer()">Submit</button>
<button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next</button>
</div>

</div>

<div id="popup" class="popup"></div>

<!-- AUDIO -->
<audio id="correctSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b0b61.mp3"></audio>
<audio id="wrongSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_6c3e0e4d0a.mp3"></audio>
<audio id="bgMusic" src="https://cdn.pixabay.com/audio/2022/03/15/audio_4f5b8d1dcb.mp3" loop></audio>

<script>
let name="",level=1,unlocked=1,qIndex=0;
let answers=[],selected=[];
let lives=3,timer,timeLeft=10;
let score=0;

/* START */
function startGame(){
    name=document.getElementById("playerName").value.trim();
    if(name===""){showPopup("Enter name","wrong");return;}

    document.getElementById("bgMusic").play().catch(()=>{});

    document.getElementById("startScreen").style.display="none";
    document.getElementById("levelScreen").style.display="block";
}

/* LEVEL */
function startLevel(l){
    if(l>unlocked){showPopup("Locked","wrong");return;}

    level=l;qIndex=0;
    if(level===4) lives=3;

    document.getElementById("progressFill").style.width="0%";

    document.getElementById("levelScreen").style.display="none";
    document.getElementById("gameScreen").style.display="block";

    loadQ();
}

/* LOAD */
function loadQ(){
    selected=[];
    document.getElementById("nextBtn").style.display="none";

    let num,text="",opts=[],ans=[];

    if(level===1){
        num=Math.floor(Math.random()*10)+10;
        text="Factors of "+num;
        for(let i=1;i<=10;i++){opts.push(i);if(num%i===0)ans.push(i);}
    }
    else if(level===2){
        let n=Math.floor(Math.random()*5)+2;
        text="Multiples of "+n;
        for(let i=1;i<=5;i++){let v=n*i;opts.push(v);ans.push(v);}
    }
    else if(level===3){
        let a=12,b=18;
        text="Common factors of "+a+" & "+b;
        for(let i=1;i<=10;i++){opts.push(i);if(a%i===0&&b%i===0)ans.push(i);}
    }
    else{
        let t=Math.floor(Math.random()*20)+20;
        text="👑 BOSS: Divide "+t+" treasures equally!";
        for(let i=1;i<=10;i++){opts.push(i);if(t%i===0)ans.push(i);}
        timeLeft=10;
        startTimer();
    }

    answers=ans;
    document.getElementById("question").innerText=text;

    let html="";
    opts.forEach(o=>{
        html+=`<button class="option" onclick="selectOption(this,${o})">${o}</button>`;
    });
    document.getElementById("options").innerHTML=html;

    updateStatus();
}

/* STATUS */
function updateStatus(){
    document.getElementById("status").innerText =
    level===4 ? "❤️ "+lives+" | ⏱ "+timeLeft :
    "Level "+level+" Q"+(qIndex+1)+"/3";
}

/* TIMER */
function startTimer(){
    clearInterval(timer);
    timer=setInterval(()=>{
        timeLeft--;updateStatus();
        if(timeLeft===0){
            clearInterval(timer);
            lives--;
            showPopup("Time Up","wrong");
            if(lives===0) endGame();
            else loadQ();
        }
    },1000);
}

/* SELECT */
function selectOption(btn,val){
    if(selected.includes(val)){
        selected=selected.filter(v=>v!==val);
        btn.classList.remove("selected");
    }else{
        selected.push(val);
        btn.classList.add("selected");
    }
}

/* CHECK */
function checkAnswer(){
    let correct=answers.every(a=>selected.includes(a)) &&
                selected.every(s=>answers.includes(s));

    if(correct){
        score+=10;
        document.getElementById("stars").innerText="⭐ "+score;

        document.getElementById("correctSound").play();
        showPopup("Correct 🎉","correct");

        if(level===4) clearInterval(timer);

        document.getElementById("nextBtn").style.display="inline";
    }
    else{
        document.getElementById("wrongSound").play();
        showPopup("Try Again","wrong");

        document.querySelector(".game-box").classList.add("shake");

        if(level===4){
            lives--;updateStatus();
            if(lives===0){endGame();return;}
        }

        setTimeout(()=>{
            selected=[];
            document.querySelectorAll(".option").forEach(b=>{
                b.classList.remove("selected");
            });
            document.querySelector(".game-box").classList.remove("shake");
        },1000);
    }
}

/* PROGRESS */
function updateProgress(){
    let percent=(qIndex/3)*100;
    document.getElementById("progressFill").style.width=percent+"%";
}

/* NEXT */
function nextQuestion(){
    qIndex++;
    updateProgress();

    if(level===4 && qIndex===3){
        confetti();
        showCertificate();
        return;
    }

    if(qIndex===3){
        unlocked++;

        if(unlocked>=2) document.getElementById("lvl2").classList.remove("locked");
        if(unlocked>=3) document.getElementById("lvl3").classList.remove("locked");
        if(unlocked>=4) document.getElementById("lvl4").classList.remove("locked");

        showPopup("Level Complete","correct");

        gameScreen.style.display="none";
        levelScreen.style.display="block";
    } else loadQ();
}

/* CONFETTI */
function confetti(){
    for(let i=0;i<120;i++){
        let d=document.createElement("div");
        d.style.position="fixed";
        d.style.width="6px";
        d.style.height="6px";
        d.style.background="hsl("+Math.random()*360+",100%,50%)";
        d.style.top=Math.random()*100+"%";
        d.style.left=Math.random()*100+"%";
        document.body.appendChild(d);
        setTimeout(()=>d.remove(),2000);
    }
}

/* LEADERBOARD */
function saveScore(){
    let data=JSON.parse(localStorage.getItem("leaderboard"))||[];
    data.push({name:name,score:score});
    data.sort((a,b)=>b.score-a.score);
    data=data.slice(0,5);
    localStorage.setItem("leaderboard",JSON.stringify(data));
}

/* CERTIFICATE */
function showCertificate(){
    saveScore();
    let data=JSON.parse(localStorage.getItem("leaderboard"))||[];

    let list="<h3>🏆 Leaderboard</h3>";
    data.forEach((d,i)=>{
        list+="<p>"+(i+1)+". "+d.name+" - ⭐ "+d.score+"</p>";
    });

    document.body.innerHTML=
    "<h1>🏅 Certificate</h1><h2>"+name+"</h2><p>Score: ⭐ "+score+"</p>"
    +list+
    "<button onclick='window.print()'>Print</button>";
}

/* END */
function endGame(){
    showPopup("Game Over","wrong");
    setTimeout(()=>location.reload(),2000);
}

/* POPUP FIX */
function showPopup(msg,type){
    let p=document.getElementById("popup");
    p.classList.remove("correct","wrong");
    if(type==="correct") p.classList.add("correct");
    if(type==="wrong") p.classList.add("wrong");
    p.innerText=msg;
    p.style.display="block";
    setTimeout(()=>p.style.display="none",1200);
}
</script>

</body>
</html>
