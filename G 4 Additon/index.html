<!DOCTYPE html>

<style>
body {

}

/* Interactive floating bubbles */
.bubble {
  position: absolute;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(255,255,255,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size: 24px;
  cursor: pointer;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

.container { padding: 12px; position:relative; z-index:1; }
button { padding: 10px 16px; margin: 6px; font-size: 15px; border-radius: 10px; }
input { padding: 10px; font-size: 15px; }
.card { background:#fff; border-radius:12px; padding:10px; margin:8px auto; max-width:520px; box-shadow:0 2px 6px rgba(0,0,0,0.1);}
